<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Fruitiger Game Hub (Monochrome Edition)</title>
<meta name="theme-color" content="#000000">
<style>
/* -------------------------------------------------------------
   CUSTOM OTF FONT CONFIGURATION
   Replace 'YOUR_FONT_FILE.otf' below with your OTF file URL or path.
------------------------------------------------------------- */
@font-face {
  font-family: 'CustomOTFFont';
  src: url('APPFONT/bitshow.regular.otf') format('opentype');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}

:root {
  --bg-main: #000000;
  --bg-sidebar: #080808;
  --bg-card: #0f0f0f;
  --bg-hover: #171717;
  --border-line: #222222;
  --text-white: #ffffff;
  --text-gray: #8e8e93;
  --text-dark-gray: #48484a;
}

/* Universal selector forces the OTF font onto every element */
*, *::before, *::after, input, button, textarea, select { 
  margin: 0; 
  padding: 0; 
  box-sizing: border-box; 
  -webkit-tap-highlight-color: transparent;
  font-family: 'CustomOTFFont', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
}

html, body { width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-main); color: var(--text-white); }

.app-container { display: flex; width: 100vw; height: 100vh; height: 100dvh; }

/* --- Sidebar --- */
.sidebar {
  width: 220px;
  background-color: var(--bg-sidebar);
  border-right: 1px solid var(--border-line);
  display: flex;
  flex-direction: column;
  padding: 20px 14px;
  flex-shrink: 0;
  z-index: 10;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 8px 20px 8px;
  border-bottom: 1px solid var(--border-line);
  margin-bottom: 20px;
  cursor: pointer;
}

.brand-logo {
  width: 32px;
  height: 32px;
  background: #ffffff;
  color: #000000;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 1.1rem;
}

.brand-title { font-size: 1.1rem; font-weight: 800; letter-spacing: 1.5px; color: #fff; }

.nav-menu { display: flex; flex-direction: column; gap: 6px; flex: 1; }
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-radius: 8px;
  color: var(--text-gray);
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.nav-item:hover, .nav-item.active { background: var(--bg-hover); color: #fff; }
.nav-item.active { border-left: 3px solid #ffffff; }

/* --- Main Section --- */
.main-wrapper { flex: 1; display: flex; flex-direction: column; height: 100%; overflow: hidden; }

.header {
  height: 60px;
  padding: 0 30px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border-line);
  background: #000000;
}

.search-input {
  width: 320px;
  padding: 9px 16px;
  background-color: #0d0d0d;
  border: 1px solid var(--border-line);
  border-radius: 20px;
  color: #fff;
  font-size: 0.88rem;
  outline: none;
}
.search-input:focus { border-color: #ffffff; }

.content-area { flex: 1; padding: 20px 30px; overflow-y: auto; }

.section-label {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--text-gray);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 16px;
}

/* --- List Items with Rectangular Image Frames --- */
.game-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.list-item {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 10px 12px;
  border-radius: 8px;
  background: transparent;
  cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease;
  border: 1px solid transparent;
}

.list-item:hover {
  background: var(--bg-hover);
  border-color: var(--border-line);
}

.list-thumb-wrapper {
  width: 120px;
  height: 68px;
  border-radius: 6px;
  overflow: hidden;
  background-color: #121212;
  flex-shrink: 0;
  border: 1px solid var(--border-line);
}

.list-thumb {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.list-info {
  display: flex;
  flex-direction: column;
  justify-content: center;
  overflow: hidden;
}

.list-title {
  font-size: 0.98rem;
  font-weight: 700;
  color: #ffffff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 3px;
}

.list-desc {
  font-size: 0.82rem;
  color: var(--text-gray);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.add-btn-item {
  border: 1px dashed var(--border-line);
  margin-top: 10px;
  justify-content: center;
}
.add-btn-item:hover { border-color: #fff; background: var(--bg-hover); }

/* --- GAME MENU --- */
#detailView {
  display: none;
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  background-color: #000000;
  z-index: 500;
  flex-direction: column;
}

.close-btn {
  position: absolute;
  top: 24px;
  right: 28px;
  width: 40px;
  height: 40px;
  background: rgba(0, 0, 0, 0.7);
  border: 1px solid var(--border-line);
  border-radius: 50%;
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(8px);
  transition: all 0.2s ease;
}
.close-btn:hover { background: #ffffff; color: #000000; transform: scale(1.05); }

.detail-top-half {
  height: 75vh;
  width: 100%;
  position: relative;
  background-size: cover;
  background-position: center;
  display: flex;
  align-items: flex-end;
  border-bottom: 1px solid var(--border-line);
}

.detail-fade-overlay {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  background: linear-gradient(0deg, #000000 0%, rgba(0, 0, 0, 0.4) 50%, transparent 100%);
}

.detail-title-bottom-left {
  position: relative;
  z-index: 5;
  padding: 0 0 35px 45px;
  font-size: 3.8rem;
  font-weight: 900;
  color: #ffffff;
  letter-spacing: -1.5px;
  text-shadow: 0 4px 20px rgba(0,0,0,0.9);
}

.detail-bottom-half {
  height: 25vh;
  width: 100%;
  background: #000000;
  padding: 0 45px;
  display: flex;
  align-items: center;
  justify-content: flex-start;
}

.action-buttons-container {
  display: flex;
  align-items: center;
  gap: 20px;
}

.steam-play-btn {
  background: #ffffff;
  color: #000000;
  border: none;
  padding: 18px 60px;
  border-radius: 8px;
  font-size: 1.2rem;
  font-weight: 900;
  letter-spacing: 1px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: transform 0.15s, background-color 0.15s, box-shadow 0.15s;
}
.steam-play-btn:hover { transform: translateY(-2px); background-color: #e4e4e7; box-shadow: 0 6px 20px rgba(255, 255, 255, 0.2); }

.steam-install-btn {
  background: #121212;
  color: #ffffff;
  border: 1px solid var(--border-line);
  padding: 18px 42px;
  border-radius: 8px;
  font-size: 1.05rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
}
.steam-install-btn:hover { background: #1c1c1e; border-color: #444444; transform: translateY(-2px); }

/* Game Player Frame */
#gamePlayerView {
  display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  background: #000; z-index: 1000; flex-direction: column;
}
.player-header { height: 48px; background: var(--bg-sidebar); border-bottom: 1px solid var(--border-line); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
.player-title { font-weight: 700; font-size: 0.9rem; color: #fff; }
.action-btn { background: #171717; color: #fff; border: 1px solid var(--border-line); padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
.action-btn:hover { background: #ffffff; color: #000000; }
.player-iframe-container { flex: 1; width: 100%; height: calc(100% - 48px); }
.player-iframe-container iframe { width: 100%; height: 100%; border: 0; }

/* Add Modal */
.add-modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); justify-content: center; align-items: center; }
.add-modal-content { background: var(--bg-card); padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; border: 1px solid var(--border-line); }
.form-group { margin-bottom: 14px; }
.form-input { width: 100%; padding: 10px 14px; background: #080808; border: 1px solid var(--border-line); border-radius: 6px; color: #fff; outline: none; font-size: 0.9rem; }
.form-input:focus { border-color: #ffffff; }
.btn-submit { width: 100%; padding: 12px; background: #ffffff; color: #000000; border: none; border-radius: 6px; font-weight: 800; cursor: pointer; }

@media (max-width: 768px) {
  .sidebar { width: 60px; padding: 15px 8px; }
  .brand-title, .nav-text { display: none; }
  .detail-top-half { height: 65vh; }
  .detail-bottom-half { height: 35vh; padding: 0 20px; }
  .detail-title-bottom-left { font-size: 2.4rem; padding: 0 0 20px 20px; }
}
</style>
</head>
<body>

<div class="app-container">
  <aside class="sidebar">
    <div class="brand" onclick="returnHome()">
      <div class="brand-logo">G</div>
      <div class="brand-title">FRUITIGER</div>
    </div>
    <nav class="nav-menu">
      <div class="nav-item active"><span class="nav-text">Library</span></div>
      <div class="nav-item" onclick="openAddModal()"><span class="nav-text">Add Game</span></div>
    </nav>
  </aside>

  <div class="main-wrapper">
    <header class="header">
      <input type="text" id="searchInput" class="search-input" placeholder="Search games..." oninput="filterGames()">
    </header>

    <main class="content-area">
      <div class="section-label">Title</div>
      <div class="game-list" id="gameList">
        <!-- Dynamic Games Stack Here -->
      </div>
      <div class="list-item add-btn-item" onclick="openAddModal()">
        <span style="font-size: 1.2rem; font-weight: 800;">+</span>
        <span class="list-title">Add Custom Game</span>
      </div>
    </main>
  </div>
</div>

<!-- GAME DETAIL VIEW -->
<div id="detailView">
  <div class="detail-top-half" id="detailBanner">
    <div class="detail-fade-overlay"></div>
    <button class="close-btn" onclick="closeDetailView()">✕</button>
    <div class="detail-title-bottom-left" id="detailTitle">Game Title</div>
  </div>

  <div class="detail-bottom-half">
    <div class="action-buttons-container">
      <button class="steam-play-btn" onclick="launchGameFromDetails()">
        ▶ PLAY
      </button>
      <button class="steam-install-btn" onclick="installCurrentGame()">
        ⬇ INSTALL
      </button>
    </div>
  </div>
</div>

<!-- Game Player -->
<div id="gamePlayerView">
  <div class="player-header">
    <div class="player-title" id="playerTitle">Playing</div>
    <div>
      <button class="action-btn" onclick="openInNewTab()">Open External</button>
      <button class="action-btn" onclick="returnHome()">Close</button>
    </div>
  </div>
  <div class="player-iframe-container">
    <iframe id="gameIframe" allowfullscreen="true"></iframe>
  </div>
</div>

<!-- Add Modal -->
<div id="addModal" class="add-modal">
  <div class="add-modal-content">
    <h3 style="margin-bottom: 16px; font-weight:800; color:#fff;">Add Custom Game</h3>
    <div class="form-group"><input type="text" id="inputName" class="form-input" placeholder="Game Title"></div>
    <div class="form-group"><input type="text" id="inputImg" class="form-input" placeholder="Banner / Image URL"></div>
    <div class="form-group"><input type="text" id="inputUrl" class="form-input" placeholder="Game Web URL"></div>
    <div class="form-group"><input type="text" id="inputDesc" class="form-input" placeholder="Sub-label / Description"></div>
    <button class="btn-submit" onclick="confirmAddGame()">Save Game</button>
  </div>
</div>

<script>
function cleanWebUrl(url) {
  if (!url) return '';
  if (url.includes('raw.githubusercontent.com')) {
    return url.replace('raw.githubusercontent.com', 'raw.githack.com');
  }
  return url;
}

const BASE_CDN_NETWORK = "https://raw.githack.com/rzwn2bm626-eng/frutiger-assets-v9/main/";
const GAMES_FOLDER_NETWORK = "gmes/";
const FALLBACK_IMG = "https://img.icons8.com/?size=100&id=gp2EGUQ15At9&format=png&color=999999";

const HIDDEN_GAMES = [
  "Geometry Dash Lite (REMAKE)",
  "Plants vs. Zombies 2 Gardenless",
  "Geometry Dash Lite",
  "Subway Surfers New Orleans",
  "Subway Surfers San Francisco",
  "Cross Yr Oad",

];

let DATA = { games: [] };
let activeGameName = '', activeGameUrl = '', activeGameImg = '', activeGameDesc = '';
let currentGameUrl = '', currentGameCode = '';

function safeArray(arr) { return Array.isArray(arr) ? arr : []; }

function dedupeGames(games) {
  const seen = new Set();
  return games.filter(g => {
    if (!g || !g.url) return false;
    if (seen.has(g.url)) return false;
    seen.add(g.url);
    return true;
  });
}

async function loadNetworkGames() {
  try {
    const cacheBuster = '?t=' + new Date().getTime();
    const r = await fetch("https://raw.githubusercontent.com/rzwn2bm626-eng/frutiger-assets-v9/main/gmes.json" + cacheBuster, { cache: 'no-store' });
    if (!r.ok) { loadFromCacheFallback(); return; }
    const d = await r.json();
    let rawArray = safeArray(d);
        
    const freshData = dedupeGames(rawArray.map(g => {
      if (!g || typeof g !== "object") return null;
      let file = g.file_name || g.link || g.url || g.file || g.path || g.html;
      let title = g.title || g.name || g.game || "Untitled Game";
      if (!file) return null;
      
      file = String(file).replace(/^\/+/, "");
      let rawGameUrl = file.startsWith("http") ? file : (BASE_CDN_NETWORK + (file.startsWith(GAMES_FOLDER_NETWORK) ? file : GAMES_FOLDER_NETWORK + file));
      let thumb = g.thumb || g.image || g.img || g.thumbnail || FALLBACK_IMG;
      if (thumb !== FALLBACK_IMG && !thumb.startsWith("http")) thumb = BASE_CDN_NETWORK + thumb.replace(/^\/+/, "");
      
      return { 
        name: title,
        description: g.description || g.desc || "Fruitiger Library Game",
        img: thumb,
        url: cleanWebUrl(rawGameUrl)
      };
    }).filter(Boolean));

    const filteredData = freshData.filter(game => {
      const gameTitle = game.name.trim().toLowerCase();
      return !HIDDEN_GAMES.some(hiddenName => gameTitle === hiddenName.trim().toLowerCase());
    });

    localStorage.setItem('my_games_cache', JSON.stringify(filteredData));
    DATA.games = filteredData;
    renderGames();
  } catch (e) {
    loadFromCacheFallback();
  }
}

function loadFromCacheFallback() {
  const cachedData = localStorage.getItem('my_games_cache');
  if (cachedData) {
    try {
      DATA.games = JSON.parse(cachedData).filter(game => {
        const gameTitle = game.name.trim().toLowerCase();
        return !HIDDEN_GAMES.some(hiddenName => gameTitle === hiddenName.trim().toLowerCase());
      });
    } catch(err) { DATA.games = []; }
  }
  renderGames();
}

function renderGames() {
  const list = document.getElementById('gameList');
  list.innerHTML = '';

  DATA.games.forEach(game => {
    const item = document.createElement('div');
    item.className = 'list-item remote-item';
    item.setAttribute('data-name', game.name.toLowerCase());
    item.onclick = () => openDetailView(game.name, game.url, game.img, game.description);
    
    item.innerHTML = `
      <div class="list-thumb-wrapper">
        <img class="list-thumb" src="${game.img}" alt="${game.name}" onerror="this.src='${FALLBACK_IMG}'">
      </div>
      <div class="list-info">
        <div class="list-title">${game.name}</div>
        <div class="list-desc">${game.description}</div>
      </div>`;
    list.appendChild(item);
  });
}

function filterGames() {
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  document.querySelectorAll('.remote-item').forEach(item => {
    const name = item.getAttribute('data-name') || '';
    item.style.display = name.includes(query) ? 'flex' : 'none';
  });
}

async function openDetailView(name, url, img, desc) {
  activeGameName = name;
  activeGameUrl = cleanWebUrl(url);
  activeGameImg = img || FALLBACK_IMG;
  activeGameDesc = desc || 'Fruitiger Library Game';

  document.getElementById('detailTitle').innerText = activeGameName;
  document.getElementById('detailBanner').style.backgroundImage = `url('${activeGameImg}')`;
  document.getElementById('detailView').style.display = 'flex';

  currentGameCode = '';
  try {
    const response = await fetch(activeGameUrl);
    if (response.ok) currentGameCode = await response.text();
  } catch (err) {}
}

function closeDetailView() { document.getElementById('detailView').style.display = 'none'; }

function launchGameFromDetails() {
  closeDetailView();
  currentGameUrl = activeGameUrl;
  const playerView = document.getElementById('gamePlayerView');
  playerView.style.display = 'flex';
  document.getElementById('playerTitle').innerText = activeGameName;
  const iframe = document.getElementById('gameIframe');

  if (currentGameCode) {
    const blob = new Blob([currentGameCode], { type: 'text/html' });
    iframe.src = URL.createObjectURL(blob);
  } else {
    iframe.src = activeGameUrl;
  }
}

async function installCurrentGame() {
  if (!activeGameName || !activeGameUrl) return;

  let codeToSend = currentGameCode;
  if (!codeToSend) {
    try {
      const res = await fetch(activeGameUrl);
      if (res.ok) codeToSend = await res.text();
    } catch (err) {}
  }

  window.parent.postMessage({
    type: 'INSTALL_APP',
    app: {
      name: activeGameName,
      icon: activeGameImg,
      url: cleanWebUrl(activeGameUrl),
      code: codeToSend,
      description: activeGameDesc,
      isFromAppStore: true
    }
  }, '*');
}

function openInNewTab() {
  if (!currentGameUrl) return;
  if (currentGameCode) {
    const blob = new Blob([currentGameCode], { type: 'text/html' });
    window.open(URL.createObjectURL(blob), '_blank');
  } else {
    window.open(currentGameUrl, '_blank');
  }
}

function returnHome() {
  document.getElementById('gamePlayerView').style.display = 'none';
  document.getElementById('detailView').style.display = 'none';
  document.getElementById('gameIframe').src = '';
}

function openAddModal() { document.getElementById('addModal').style.display = 'flex'; }

function confirmAddGame() {
  const name = document.getElementById('inputName').value;
  const imgUrl = document.getElementById('inputImg').value;
  const url = cleanWebUrl(document.getElementById('inputUrl').value);
  const desc = document.getElementById('inputDesc').value || 'Custom Game';

  if (!name || !url) return alert("Please enter both a title and a game URL.");

  DATA.games.push({ name, url, img: imgUrl || FALLBACK_IMG, description: desc });
  renderGames();
  document.getElementById('addModal').style.display = 'none';
}

window.addEventListener('DOMContentLoaded', loadNetworkGames);
</script>
</body>
</html>
