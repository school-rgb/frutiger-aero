<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamHub - Dynamic Movie Portal</title>
    <style>
        /* Transparent/No Background Core Styling */
        :root {
            --primary-color: #e50914;
            --text-color: #ffffff;
            --glass-bg: rgba(0, 0, 0, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        /* Support for dynamic theme classes */
        body.theme-blue { --primary-color: #0071eb; }
        body.theme-green { --primary-color: #2ecc71; }
        body.theme-purple { --primary-color: #9b59b6; }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: transparent !important;
            color: var(--text-color);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Navigation Bar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary-color);
            letter-spacing: 1px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        nav ul li a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        nav ul li a:hover {
            color: var(--primary-color);
        }

        /* Hero Banner Section */
        .hero-banner {
            position: relative;
            width: 100%;
            height: 70vh;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: flex-end;
            padding: 50px 5%;
            box-shadow: inset 0 -100px 100px -50px rgba(0,0,0,0.8);
            transition: background-image 0.5s ease-in-out;
        }

        .hero-content {
            max-width: 600px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
        }

        .hero-title {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .hero-overview {
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #ddd;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            opacity: 0.85;
        }

        /* Movie Grid Section */
        .container {
            padding: 40px 5%;
        }

        .section-title {
            font-size: 22px;
            margin-bottom: 20px;
            border-left: 4px solid var(--primary-color);
            padding-left: 10px;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .movie-card {
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .movie-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        .movie-poster {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        .movie-info {
            padding: 15px;
        }

        .movie-title {
            font-size: 16px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 5px;
        }

        .movie-year {
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">StreamHub</div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Movies</a></li>
                <li><a href="#">Trending</a></li>
                <li><a href="#">API Feeds</a></li>
            </ul>
        </nav>
    </header>

    <section id="heroBanner" class="hero-banner">
        <div class="hero-content">
            <h1 id="heroTitle" class="hero-title">Loading Featured Movie...</h1>
            <p id="heroOverview" class="hero-overview">Please wait while we connect to the public media stream database...</p>
            <a href="#" class="btn">Watch Trailer</a>
        </div>
    </section>

    <div class="container">
        <h2 class="section-title">Trending Post API Feed</h2>
        <div id="movieGrid" class="movie-grid">
            </div>
    </div>

    <script>
        // 1. Theme Synchronization Logic
        window.addEventListener('DOMContentLoaded', () => {
            const currentTheme = localStorage.getItem('aero_selected_theme');
            if (currentTheme) {
                document.body.className = 'theme-' + currentTheme;
            }
            fetchMovieData();
        });

        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'SET_THEME') {
                const newTheme = event.data.theme;
                document.body.className = 'theme-' + newTheme;
                localStorage.setItem('aero_selected_theme', newTheme);
            }
        });

        // 2. Movie Data API Mock / Integration Service
        async function fetchMovieData() {
            // Using public domain/sample data structure mimicking a standard TMDB or custom Movie API response
            const mockApiEndpoint = "https://api.tvmaze.com/shows"; // Public sample endpoint for rich testing data
            
            try {
                const response = await fetch(mockApiEndpoint);
                const shows = await response.json();
                
                // Set Hero Banner using the first item
                const featured = shows[0];
                const heroBanner = document.getElementById('heroBanner');
                const heroTitle = document.getElementById('heroTitle');
                const heroOverview = document.getElementById('heroOverview');

                heroBanner.style.backgroundImage = `linear-gradient(to top, rgba(0,0,0,0.9), transparent), url('${featured.image.original}')`;
                heroTitle.textContent = featured.name;
                heroOverview.innerHTML = featured.summary;

                // Populate Movie Posts Grid
                const movieGrid = document.getElementById('movieGrid');
                movieGrid.innerHTML = '';

                // Loop through a subset of results to build out active posts
                shows.slice(1, 13).forEach(show => {
                    const card = document.createElement('div');
                    card.className = 'movie-card';
                    card.innerHTML = `
                        <img class="movie-poster" src="${show.image ? show.image.medium : 'https://via.placeholder.com/200x300'}" alt="${show.name}">
                        <div class="movie-info">
                            <div class="movie-title" title="${show.name}">${show.name}</div>
                            <div class="movie-year">Rating: ${show.rating.average || 'N/A'} | Premiered: ${show.premiered ? show.premiered.substring(0,4) : 'TBD'}</div>
                        </div>
                    `;
                    movieGrid.appendChild(card);
                });

            } catch (error) {
                console.error("Error fetching API feed:", error);
                document.getElementById('heroTitle').textContent = "Failed to load API stream.";
                document.getElementById('heroOverview').textContent = "Please check your network connection or verify the endpoint URL.";
            }
        }
    </script>
</body>
</html>
