<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Pro Live Activity Timer</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Ambient Dynamic Background Glow */
        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60vw;
            height: 60vh;
            background: radial-gradient(ellipse, rgba(255, 159, 10, 0.12) 0%, rgba(0, 0, 0, 0) 70%);
            filter: blur(100px);
            pointer-events: none;
            z-index: 0;
        }

        /* Fullscreen Minimalist Dynamic Widget Layout */
        .timer-widget {
            position: relative;
            z-index: 1;
            width: 100vw;
            height: 100vh;
            background: #0b0b0d;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 6vh 20px;
        }

        /* Top spacer to balance layout */
        .top-spacer {
            height: 40px;
        }

        /* Central Circular Indicator Ring (Larger for Fullscreen) */
        .ring-content-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .progress-ring-container {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .progress-ring-container svg {
            position: absolute;
            transform: rotate(-90deg);
        }

        .time-display-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
        }

        .time-display {
            font-size: 64px;
            font-weight: 700;
            letter-spacing: -2px;
            line-height: 1;
        }

        .sub-time {
            font-size: 14px;
            color: #8e8e93;
            margin-top: 10px;
            font-weight: 500;
        }

        /* Bottom Section Containing Action Controls & Subtle Settings Trigger */
        .bottom-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 360px;
        }

        /* Both buttons in the middle */
        .timer-controls {
            display: flex;
            gap: 16px;
            width: 100%;
        }

        .btn {
            flex: 1;
            height: 60px;
            border-radius: 20px;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.15s ease, background-color 0.2s ease, opacity 0.2s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-reset {
            background-color: #2c2c2e;
            color: #c7c7cc;
        }
        .btn-reset:hover { background-color: #3a3a3c; color: #fff; }

        .btn-action {
            background-color: #ff9f0a;
            color: #000;
        }
        .btn-action:hover { background-color: #ffb129; }

        /* Subtle Gray Settings Trigger (barely see it, clickable) */
        .subtle-settings-trigger {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.18);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            letter-spacing: 0.5px;
            padding: 6px 12px;
            border-radius: 8px;
            transition: color 0.2s, background 0.2s;
        }

        .subtle-settings-trigger:hover {
            color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.03);
        }

        /* Hidden Settings Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .settings-card {
            background: #1c1c1e;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 32px;
            width: 90%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
        }

        .settings-card h3 {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 12px;
            color: #8e8e93;
            font-weight: 500;
        }

        .settings-card input {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 14px 16px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .settings-card input:focus {
            border-color: #ff9f0a;
        }

        .settings-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .modal-btn {
            flex: 1;
            height: 48px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            border: none;
        }

        .modal-btn-cancel {
            background: #2c2c2e;
            color: #c7c7cc;
        }

        .modal-btn-save {
            background: #ff9f0a;
            color: #000;
        }
    </style>
</head>
<body>

<div class="ambient-glow"></div>

<!-- Fullscreen Timer Interface -->
<div class="timer-widget" id="timerWidget">
    <div class="top-spacer"></div>

    <div class="ring-content-wrapper">
        <div class="progress-ring-container">
            <svg width="280" height="280">
                <circle cx="140" cy="140" r="124" stroke="#1c1c1e" stroke-width="12" fill="none"></circle>
                <circle id="progressCircle" cx="140" cy="140" r="124" stroke="#ff9f0a" stroke-width="12" fill="none" 
                        stroke-dasharray="779.11" 
                        stroke-dashoffset="0" 
                        stroke-linecap="round" style="transition: stroke-dashoffset 0.5s linear;"></circle>
            </svg>
            <div class="time-display-group">
                <span class="time-display" id="timeDisplay">05:00</span>
                <span class="sub-time" id="endTimeDisplay">10:45 AM</span>
            </div>
        </div>
    </div>

    <div class="bottom-section">
        <div class="timer-controls">
            <button class="btn btn-reset" id="resetBtn">Reset</button>
            <button class="btn btn-action" id="actionBtn">Pause ⏸</button>
        </div>
        <!-- Subtle hidden-in-plain-sight settings button -->
        <button class="subtle-settings-trigger" id="openSettingsBtn">⚙ Settings</button>
    </div>
</div>

<!-- Settings Popup Modal -->
<div class="modal-overlay" id="settingsModal">
    <div class="settings-card">
        <h3>Edit Timer</h3>
        <div class="input-group">
            <label>Timer Label</label>
            <input type="text" id="modalNameInput" value="Timer">
        </div>
        <div class="input-group">
            <label>Minutes</label>
            <input type="number" id="modalMinutesInput" value="5" min="1" max="1440">
        </div>
        <div class="settings-actions">
            <button class="modal-btn modal-btn-cancel" id="closeSettingsBtn">Cancel</button>
            <button class="modal-btn modal-btn-save" id="saveSettingsBtn">Save & Reset</button>
        </div>
    </div>
</div>

<script>
    // Core Timer State Object
    let timerState = {
        title: 'Timer',
        totalSeconds: 300,
        remainingSeconds: 300,
        isRunning: true
    };

    const CIRCUMFERENCE = 2 * Math.PI * 124; // Radius = 124

    // DOM Elements
    const timerWidget = document.getElementById('timerWidget');
    const timeDisplay = document.getElementById('timeDisplay');
    const endTimeDisplay = document.getElementById('endTimeDisplay');
    const progressCircle = document.getElementById('progressCircle');

    const resetBtn = document.getElementById('resetBtn');
    const actionBtn = document.getElementById('actionBtn');

    // Modal elements
    const settingsModal = document.getElementById('settingsModal');
    const openSettingsBtn = document.getElementById('openSettingsBtn');
    const closeSettingsBtn = document.getElementById('closeSettingsBtn');
    const saveSettingsBtn = document.getElementById('saveSettingsBtn');
    const modalNameInput = document.getElementById('modalNameInput');
    const modalMinutesInput = document.getElementById('modalMinutesInput');

    function updateView() {
        const minutes = Math.floor(timerState.remainingSeconds / 60);
        const seconds = timerState.remainingSeconds % 60;
        const timeFormatted = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        
        timeDisplay.textContent = timeFormatted;

        // Calculate alarm completion clock timestamp
        const targetDate = new Date();
        targetDate.setSeconds(targetDate.getSeconds() + timerState.remainingSeconds);
        endTimeDisplay.textContent = targetDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        // Circular progress update
        const progress = timerState.totalSeconds > 0 ? (timerState.remainingSeconds / timerState.totalSeconds) : 0;
        const strokeDashoffset = CIRCUMFERENCE - (progress * CIRCUMFERENCE);
        progressCircle.style.strokeDashoffset = strokeDashoffset;

        // Button states
        if (timerState.isRunning) {
            actionBtn.textContent = 'Pause ⏸';
        } else {
            actionBtn.textContent = 'Start ▶';
        }
    }

    // Engine loop tracking active timer countdown
    setInterval(() => {
        if (timerState.isRunning && timerState.remainingSeconds > 0) {
            timerState.remainingSeconds--;
            if (timerState.remainingSeconds === 0) {
                timerState.isRunning = false;
            }
            updateView();
        }
    }, 1000);

    // Pause / Resume Toggle
    actionBtn.addEventListener('click', () => {
        timerState.isRunning = !timerState.isRunning;
        updateView();
    });

    // Reset current timer back to total duration
    resetBtn.addEventListener('click', () => {
        timerState.remainingSeconds = timerState.totalSeconds;
        timerState.isRunning = false;
        updateView();
    });

    // Modal Toggle Interactions
    openSettingsBtn.addEventListener('click', () => {
        modalNameInput.value = timerState.title;
        modalMinutesInput.value = Math.round(timerState.totalSeconds / 60);
        settingsModal.classList.add('active');
    });

    closeSettingsBtn.addEventListener('click', () => {
        settingsModal.classList.remove('active');
    });

    saveSettingsBtn.addEventListener('click', () => {
        const newName = modalNameInput.value.trim() || 'Timer';
        const newMins = parseInt(modalMinutesInput.value, 10);

        if (isNaN(newMins) || newMins <= 0) return;

        timerState.title = newName;
        timerState.totalSeconds = newMins * 60;
        timerState.remainingSeconds = timerState.totalSeconds;
        timerState.isRunning = true;

        settingsModal.classList.remove('active');
        updateView();
    });

    // Initial load execution
    updateView();
</script>

</body>
</html>
