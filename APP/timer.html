<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Live Activity Timer</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at 50% 0%, #1a1a24 0%, #08080a 75%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        /* Ambient Dynamic Background Glow */
        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70vw;
            height: 70vh;
            background: radial-gradient(ellipse, rgba(255, 159, 10, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            filter: blur(90px);
            pointer-events: none;
            z-index: 0;
        }

        .app-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Control Panel Header */
        .control-panel {
            background: rgba(24, 24, 29, 0.75);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 20px;
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .panel-title {
            font-size: 14px;
            font-weight: 600;
            color: #8e8e93;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .config-form {
            display: flex;
            gap: 10px;
        }

        .config-form input {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 12px 14px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .config-form input:focus {
            border-color: #ff9f0a;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 15px rgba(255, 159, 10, 0.2);
        }

        .input-name { flex: 1.4; }
        .input-time { width: 90px; }

        .set-btn {
            background: linear-gradient(135deg, #ff9f0a 0%, #ff8000 100%);
            color: #000;
            border: none;
            border-radius: 16px;
            padding: 0 18px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.15s, opacity 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(255, 159, 10, 0.3);
            white-space: nowrap;
        }

        .set-btn:hover {
            opacity: 0.95;
            box-shadow: 0 6px 20px rgba(255, 159, 10, 0.4);
        }

        .set-btn:active {
            transform: scale(0.96);
        }

        /* Dynamic Island / Live Activity Main Widget */
        .timer-widget {
            background: rgba(18, 18, 22, 0.85);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 36px;
            padding: 32px 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.12);
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .timer-widget.running {
            border-color: rgba(255, 159, 10, 0.4);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 35px rgba(255, 159, 10, 0.12), inset 0 1px 1px rgba(255, 255, 255, 0.15);
        }

        .timer-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 24px;
        }

        .timer-info {
            display: flex;
            flex-direction: column;
        }

        .timer-title {
            font-size: 20px;
            font-weight: 600;
            color: #fff;
            letter-spacing: -0.3px;
        }

        .timer-subtitle {
            font-size: 13px;
            color: #8e8e93;
            margin-top: 4px;
        }

        /* Status Badge */
        .status-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.06);
            color: #8e8e93;
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }
        .timer-widget.running .status-badge {
            background: rgba(255, 159, 10, 0.15);
            color: #ff9f0a;
        }

        /* Central Circular Indicator Ring */
        .ring-content-wrapper {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0 28px 0;
        }

        .progress-ring-container {
            position: relative;
            width: 210px;
            height: 210px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .progress-ring-container svg {
            position: absolute;
            transform: rotate(-90deg);
        }

        .time-display-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
        }

        .time-display {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: -1.5px;
            line-height: 1;
        }

        .sub-time {
            font-size: 13px;
            color: #8e8e93;
            margin-top: 8px;
            font-weight: 500;
        }

        /* Action Control Buttons Grid */
        .timer-controls {
            display: flex;
            gap: 14px;
            width: 100%;
        }

        .btn {
            flex: 1;
            height: 50px;
            border-radius: 18px;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: transform 0.15s ease, background-color 0.2s ease, opacity 0.2s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-reset {
            background-color: rgba(255, 255, 255, 0.07);
            color: #c7c7cc;
        }
        .btn-reset:hover { background-color: rgba(255, 255, 255, 0.14); color: #fff; }

        .btn-action {
            background-color: #ff9f0a;
            color: #000;
        }
        .btn-action:hover { background-color: #ffb129; }

        /* Mobile adaptation */
        @media (max-width: 480px) {
            .app-container {
                max-width: 100%;
            }
            .config-form {
                flex-direction: column;
            }
            .input-name, .input-time, .set-btn {
                width: 100% !important;
            }
        }
    </style>
</head>
<body>

<div class="ambient-glow"></div>

<div class="app-container">
    <!-- Configuration Panel to Change & Reset the Core Timer -->
    <div class="control-panel">
        <div class="panel-title">
            <span>Timer Settings</span>
            <span id="totalTimeLabel">5 Mins Total</span>
        </div>
        <div class="config-form">
            <input type="text" class="input-name" id="timerNameInput" placeholder="Timer Label" value="Timer">
            <input type="number" class="input-time" id="timerMinutesInput" placeholder="Minutes" value="5" min="1" max="1440">
            <button class="set-btn" id="setTimerBtn">Set & Reset</button>
        </div>
    </div>

    <!-- Main Dynamic Island Timer Widget (Permanent, cannot be closed) -->
    <div class="timer-widget running" id="timerWidget">
        <div class="timer-top-row">
            <div class="timer-info">
                <span class="timer-title" id="displayTitle">Timer</span>
                <span class="timer-subtitle" id="displaySubtitle">Active Live Activity</span>
            </div>
            <div class="status-badge" id="statusBadge">Active</div>
        </div>

        <div class="ring-content-wrapper">
            <div class="progress-ring-container">
                <svg width="210" height="210">
                    <circle cx="105" cy="105" r="92" stroke="rgba(255,255,255,0.06)" stroke-width="11" fill="none"></circle>
                    <circle id="progressCircle" cx="105" cy="105" r="92" stroke="#ff9f0a" stroke-width="11" fill="none" 
                            stroke-dasharray="578.05" 
                            stroke-dashoffset="0" 
                            stroke-linecap="round" style="transition: stroke-dashoffset 0.5s linear;"></circle>
                </svg>
                <div class="time-display-group">
                    <span class="time-display" id="timeDisplay">05:00</span>
                    <span class="sub-time" id="endTimeDisplay">10:45 AM</span>
                </div>
            </div>
        </div>

        <div class="timer-controls">
            <button class="btn btn-reset" id="resetBtn">Reset</button>
            <button class="btn btn-action" id="actionBtn">Pause ⏸</button>
        </div>
    </div>
</div>

<script>
    // Core Timer State Object
    let timerState = {
        title: 'Timer',
        totalSeconds: 300,
        remainingSeconds: 300,
        isRunning: true
    };

    const CIRCUMFERENCE = 2 * Math.PI * 92; // Radius = 92

    // DOM Elements
    const timerWidget = document.getElementById('timerWidget');
    const timerNameInput = document.getElementById('timerNameInput');
    const timerMinutesInput = document.getElementById('timerMinutesInput');
    const setTimerBtn = document.getElementById('setTimerBtn');
    const totalTimeLabel = document.getElementById('totalTimeLabel');

    const displayTitle = document.getElementById('displayTitle');
    const displaySubtitle = document.getElementById('displaySubtitle');
    const statusBadge = document.getElementById('statusBadge');
    const timeDisplay = document.getElementById('timeDisplay');
    const endTimeDisplay = document.getElementById('endTimeDisplay');
    const progressCircle = document.getElementById('progressCircle');

    const resetBtn = document.getElementById('resetBtn');
    const actionBtn = document.getElementById('actionBtn');

    function updateView() {
        const minutes = Math.floor(timerState.remainingSeconds / 60);
        const seconds = timerState.remainingSeconds % 60;
        const timeFormatted = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        
        timeDisplay.textContent = timeFormatted;
        displayTitle.textContent = timerState.title;
        totalTimeLabel.textContent = `${Math.round(timerState.totalSeconds / 60)} Mins Total`;

        // Calculate alarm completion time clock string
        const targetDate = new Date();
        targetDate.setSeconds(targetDate.getSeconds() + timerState.remainingSeconds);
        endTimeDisplay.textContent = targetDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        // Circular progress indicator update
        const progress = timerState.totalSeconds > 0 ? (timerState.remainingSeconds / timerState.totalSeconds) : 0;
        const strokeDashoffset = CIRCUMFERENCE - (progress * CIRCUMFERENCE);
        progressCircle.style.strokeDashoffset = strokeDashoffset;

        // UI state indicators
        if (timerState.isRunning) {
            timerWidget.classList.add('running');
            statusBadge.textContent = 'Active';
            actionBtn.textContent = 'Pause ⏸';
        } else {
            timerWidget.classList.remove('running');
            statusBadge.textContent = 'Paused';
            actionBtn.textContent = 'Start ▶';
        }
    }

    // Engine Loop tracking the single active timer
    setInterval(() => {
        if (timerState.isRunning && timerState.remainingSeconds > 0) {
            timerState.remainingSeconds--;
            if (timerState.remainingSeconds === 0) {
                timerState.isRunning = false;
            }
            updateView();
        }
    }, 1000);

    // Apply config changes from the top control panel (re-sets and changes the existing timer)
    setTimerBtn.addEventListener('click', () => {
        const newName = timerNameInput.value.trim() || 'Timer';
        const newMins = parseInt(timerMinutesInput.value, 10);

        if (isNaN(newMins) || newMins <= 0) return;

        timerState.title = newName;
        timerState.totalSeconds = newMins * 60;
        timerState.remainingSeconds = timerState.totalSeconds;
        timerState.isRunning = true;

        updateView();
    });

    // Pause / Resume Toggle
    actionBtn.addEventListener('click', () => {
        timerState.isRunning = !timerState.isRunning;
        updateView();
    });

    // Reset current timer back to full duration
    resetBtn.addEventListener('click', () => {
        timerState.remainingSeconds = timerState.totalSeconds;
        timerState.isRunning = false;
        updateView();
    });

    // Initial render call
    updateView();
</script>

</body>
</html>
