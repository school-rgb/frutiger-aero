<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer</title>
    <!-- Include FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Ambient Dynamic Background Glow */
        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60vw;
            height: 60vh;
            background: radial-gradient(ellipse, rgba(255, 149, 0, 0.1) 0%, rgba(0, 0, 0, 0) 70%);
            filter: blur(90px);
            pointer-events: none;
            z-index: 0;
        }

        /* Fullscreen Layout Container - adjusts seamlessly to any window size / screen */
        .timer-widget {
            position: relative;
            z-index: 1;
            width: 100vw;
            height: 100vh;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: clamp(20px, 6vh, 50px) clamp(20px, 6vw, 50px);
            box-sizing: border-box;
        }

        /* Top spacer to balance layout symmetry */
        .top-spacer {
            height: clamp(10px, 4vh, 30px);
        }

        /* Central Circular Indicator Ring (Scales fluidly based on viewport) */
        .ring-content-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
            width: 100%;
        }

        .progress-ring-container {
            position: relative;
            width: clamp(160px, 50vmin, 340px);
            height: clamp(160px, 50vmin, 340px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .progress-ring-container svg {
            position: absolute;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .time-display-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
        }

        .time-display {
            font-size: clamp(32px, 12vmin, 76px);
            font-weight: 700;
            letter-spacing: -2px;
            line-height: 1;
            color: #ffffff;
        }

        .sub-time {
            font-size: clamp(10px, 2.8vmin, 15px);
            color: #8e8e93;
            margin-top: clamp(4px, 1.5vmin, 10px);
            font-weight: 500;
        }

        /* Bottom Section Containing Action Controls & Subtle Settings Icon Trigger */
        .bottom-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(12px, 2.5vh, 20px);
            width: 100%;
            max-width: 400px;
        }

        /* Both buttons side by side in the middle bottom */
        .timer-controls {
            display: flex;
            gap: clamp(10px, 2vw, 16px);
            width: 100%;
        }

        .btn {
            flex: 1;
            height: clamp(44px, 10vmin, 62px);
            border-radius: clamp(14px, 4vmin, 22px);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            font-size: clamp(12px, 3.2vmin, 16px);
            font-weight: 600;
            transition: transform 0.15s ease, background-color 0.2s ease, opacity 0.2s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-reset {
            background-color: #1c1c1e;
            color: #ffffff;
        }
        .btn-reset:hover { background-color: #2c2c2e; }

        /* Action button is orange, with white text and white icon inside */
        .btn-action {
            background-color: #ff9f0a;
            color: #ffffff;
        }
        .btn-action i, 
        .btn-action span {
            color: #ffffff !important;
        }
        .btn-action:hover { background-color: #ffb129; }

        /* Subtle Gray Settings Icon Button (barely visible, clean professional vector icon) */
        .subtle-settings-trigger {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(14px, 3.5vmin, 18px);
            transition: color 0.2s, background 0.2s;
        }

        .subtle-settings-trigger:hover {
            color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.04);
        }

        /* Hidden Settings Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .settings-card {
            background: #1c1c1e;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 24px;
            border-radius: 28px;
            width: 90%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
        }

        .settings-card h3 {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 11px;
            color: #8e8e93;
            font-weight: 500;
        }

        .settings-card input {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 12px 14px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .settings-card input:focus {
            border-color: #ff9f0a;
        }

        .settings-actions {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }

        .modal-btn {
            flex: 1;
            height: 44px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            border: none;
        }

        .modal-btn-cancel {
            background: #2c2c2e;
            color: #ffffff;
        }

        .modal-btn-save {
            background: #ff9f0a;
            color: #ffffff;
        }
    </style>
</head>
<body>

<div class="ambient-glow"></div>

<!-- Added loop attribute to the audio tag -->
<audio id="alarmSound" src="SOUND/iphone-radial.mp3" preload="auto" loop></audio>

<!-- Fullscreen Scalable Timer Interface -->
<div class="timer-widget" id="timerWidget">
    <div class="top-spacer"></div>

    <div class="ring-content-wrapper">
        <div class="progress-ring-container">
            <svg viewBox="0 0 280 280">
                <circle cx="140" cy="140" r="124" stroke="#1c1c1e" stroke-width="12" fill="none"></circle>
                <!-- Orange tracking ring -->
                <circle id="progressCircle" cx="140" cy="140" r="124" stroke="#ff9f0a" stroke-width="12" fill="none" 
                        stroke-dasharray="779.11" 
                        stroke-dashoffset="0" 
                        stroke-linecap="round" style="transition: stroke-dashoffset 0.5s linear;"></circle>
            </svg>
            <div class="time-display-group">
                <span class="time-display" id="timeDisplay">05:00</span>
                <span class="sub-time" id="endTimeDisplay">10:45 AM</span>
            </div>
        </div>
    </div>

    <div class="bottom-section">
        <div class="timer-controls">
            <button class="btn btn-reset" id="resetBtn">
                <i class="fa-solid fa-rotate-right"></i> Reset
            </button>
            <button class="btn btn-action" id="actionBtn">
                <i class="fa-solid fa-pause" id="actionIcon"></i> <span id="actionText">Pause</span>
            </button>
        </div>
        <!-- Subtle icon gear trigger for settings -->
        <button class="subtle-settings-trigger" id="openSettingsBtn" title="Settings">
            <i class="fa-solid fa-gear"></i>
        </button>
    </div>
</div>

<!-- Settings Popup Modal -->
<div class="modal-overlay" id="settingsModal">
    <div class="settings-card">
        <h3>Edit Timer</h3>
        <div class="input-group">
            <label>Timer Label</label>
            <input type="text" id="modalNameInput" value="Timer">
        </div>
        <div class="input-group">
            <label>Minutes</label>
            <input type="number" id="modalMinutesInput" value="5" min="1" max="1440">
        </div>
        <div class="settings-actions">
            <button class="modal-btn modal-btn-cancel" id="closeSettingsBtn">Cancel</button>
            <button class="modal-btn modal-btn-save" id="saveSettingsBtn">Save & Reset</button>
        </div>
    </div>
</div>

<script>
    // Core Timer State Object
    let timerState = {
        title: 'Timer',
        totalSeconds: 300,
        remainingSeconds: 300,
        isRunning: true
    };

    const CIRCUMFERENCE = 2 * Math.PI * 124; // Radius = 124

    // DOM Elements
    const timeDisplay = document.getElementById('timeDisplay');
    const endTimeDisplay = document.getElementById('endTimeDisplay');
    const progressCircle = document.getElementById('progressCircle');

    const resetBtn = document.getElementById('resetBtn');
    const actionBtn = document.getElementById('actionBtn');
    const actionIcon = document.getElementById('actionIcon');
    const actionText = document.getElementById('actionText');
    const alarmSound = document.getElementById('alarmSound');

    // Modal elements
    const settingsModal = document.getElementById('settingsModal');
    const openSettingsBtn = document.getElementById('openSettingsBtn');
    const closeSettingsBtn = document.getElementById('closeSettingsBtn');
    const saveSettingsBtn = document.getElementById('saveSettingsBtn');
    const modalNameInput = document.getElementById('modalNameInput');
    const modalMinutesInput = document.getElementById('modalMinutesInput');

    function updateView() {
        const minutes = Math.floor(timerState.remainingSeconds / 60);
        const seconds = timerState.remainingSeconds % 60;
        const timeFormatted = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        
        timeDisplay.textContent = timeFormatted;

        // Calculate alarm completion clock timestamp
        const targetDate = new Date();
        targetDate.setSeconds(targetDate.getSeconds() + timerState.remainingSeconds);
        endTimeDisplay.textContent = targetDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        // Circular progress update
        const progress = timerState.totalSeconds > 0 ? (timerState.remainingSeconds / timerState.totalSeconds) : 0;
        const strokeDashoffset = CIRCUMFERENCE - (progress * CIRCUMFERENCE);
        progressCircle.style.strokeDashoffset = strokeDashoffset;

        // Button icon & text states
        if (timerState.isRunning) {
            actionIcon.className = "fa-solid fa-pause";
            actionText.textContent = "Pause";
        } else {
            actionIcon.className = "fa-solid fa-play";
            actionText.textContent = "Start";
        }
    }

    // Engine loop tracking active timer countdown
    setInterval(() => {
        if (timerState.isRunning && timerState.remainingSeconds > 0) {
            timerState.remainingSeconds--;
            if (timerState.remainingSeconds === 0) {
                timerState.isRunning = false;
                
                // Play looping MP3 sound when timer reaches 0
                alarmSound.currentTime = 0;
                alarmSound.play().catch(error => {
                    console.log("Audio playback blocked or failed:", error);
                });
            }
            updateView();
        }
    }, 1000);

    // Pause / Resume Toggle (Also stops looping sound if active)
    actionBtn.addEventListener('click', () => {
        timerState.isRunning = !timerState.isRunning;
        
        // Stop sound when clicking play/pause button if it was ringing
        alarmSound.pause();
        alarmSound.currentTime = 0;

        updateView();
    });

    // Reset current timer back to total duration (Also stops looping sound)
    resetBtn.addEventListener('click', () => {
        timerState.remainingSeconds = timerState.totalSeconds;
        timerState.isRunning = false;
        
        // Stop sound when clicking reset
        alarmSound.pause();
        alarmSound.currentTime = 0;

        updateView();
    });

    // Modal Toggle Interactions
    openSettingsBtn.addEventListener('click', () => {
        modalNameInput.value = timerState.title;
        modalMinutesInput.value = Math.round(timerState.totalSeconds / 60);
        settingsModal.classList.add('active');
    });

    closeSettingsBtn.addEventListener('click', () => {
        settingsModal.classList.remove('active');
    });

    saveSettingsBtn.addEventListener('click', () => {
        const newName = modalNameInput.value.trim() || 'Timer';
        const newMins = parseInt(modalMinutesInput.value, 10);

        if (isNaN(newMins) || newMins <= 0) return;

        timerState.title = newName;
        timerState.totalSeconds = newMins * 60;
        timerState.remainingSeconds = newMins * 60;
        timerState.isRunning = true;
        
        // Stop sound when saving new timer
        alarmSound.pause();
        alarmSound.currentTime = 0;

        settingsModal.classList.remove('active');
        updateView();
    });

    // Initial load execution
    updateView();
</script>

</body>
</html>
