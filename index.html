<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Google Sans', Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
    }

    body {
      height: 100vh;
      overflow: hidden;
      background: #000000;
    }

    #desktopWallpaperContainer {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    #desktopWallpaperContainer video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      inset: 0;
    }

    #rainCanvas {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      width: 100%;
      height: 100%;
    }

    .desktop {
      height: 100vh;
      width: 100vw;
      position: relative;
      overflow: hidden;
      z-index: 2;
    }

    /* --- WINDOW SYSTEM STYLES --- */
    .app-window {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #09090b;
      border-radius: 0;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      z-index: 800;
      overflow: hidden;
      border: none;
      transition: width 0.2s cubic-bezier(0.2, 0, 0, 1), height 0.2s cubic-bezier(0.2, 0, 0, 1);
    }

    .app-window.windowed {
      width: 950px;
      height: 600px;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 10;
    }

    .app-window.dragging, .app-window.resizing,
    .launcher.dragging, .launcher.resizing {
      transition: none !important;
    }

    .app-window.hidden {
      display: none !important;
    }

    .window-header {
      height: 40px;
      background: #050505;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      cursor: move;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
    }

    .window-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 500;
      color: #ffffff;
    }

    .window-title img {
      width: 18px;
      height: 18px;
    }

    .window-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .win-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 12px;
      color: #ffffff;
      transition: background 0.15s;
    }

    .win-btn img {
      width: 14px;
      height: 14px;
      object-fit: contain;
      filter: invert(1);
    }

    .win-btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .win-btn.close:hover {
      background: #e81123;
      color: white;
    }

    .window-body {
      flex: 1;
      padding: 0;
      overflow: hidden;
      position: relative;
      background: #000000;
    }

    .window-body iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Prevent iframe interaction blocks while dragging or resizing */
    body.is-interacting iframe {
      pointer-events: none !important;
    }

    /* Resizable Handles */
    .resize-handle { position: absolute; z-index: 999; display: none; }
    .app-window.windowed .resize-handle, .launcher .resize-handle { display: block; }
    .resize-handle.n  { top: -4px; left: 0; right: 0; height: 8px; cursor: ns-resize; }
    .resize-handle.s  { bottom: -4px; left: 0; right: 0; height: 8px; cursor: ns-resize; }
    .resize-handle.w  { top: 0; bottom: 0; left: -4px; width: 8px; cursor: ew-resize; }
    .resize-handle.e  { top: 0; bottom: 0; right: -4px; width: 8px; cursor: ew-resize; }
    .resize-handle.nw { top: -4px; left: -4px; width: 12px; height: 12px; cursor: nwse-resize; }
    .resize-handle.ne { top: -4px; right: -4px; width: 12px; height: 12px; cursor: nesw-resize; }
    .resize-handle.sw { bottom: -4px; left: -4px; width: 12px; height: 12px; cursor: nesw-resize; }
    .resize-handle.se { bottom: -4px; right: -4px; width: 12px; height: 12px; cursor: nwse-resize; }

    /* Right Click Context Menu */
    .context-menu {
      position: absolute;
      width: 220px;
      background: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      z-index: 1500;
      display: none;
      flex-direction: column;
    }

    .context-menu.active { display: flex; }

    .context-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      font-size: 13px;
      color: #ffffff;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.10s ease;
      position: relative;
    }

    .context-item:hover { background: rgba(255, 255, 255, 0.12); }
    .context-icon { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; opacity: 0.8; }
    .context-label { flex: 1; }
    .context-arrow { font-size: 10px; color: #888888; }

    .submenu {
      position: absolute;
      left: 100%;
      top: 0;
      width: 160px;
      background: rgba(18, 18, 18, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      display: none;
      flex-direction: column;
    }

    .context-item:hover .submenu { display: flex; }

    /* Launcher Menu - Standalone Floating Window */
    .launcher {
      position: fixed;
      width: 620px;
      height: 580px;
      min-width: 320px;
      min-height: 350px;
      background: rgba(12, 12, 12, 0.85);
      backdrop-filter: blur(35px);
      -webkit-backdrop-filter: blur(35px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      z-index: 1200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s cubic-bezier(0, 0, 0.2, 1), transform 0.25s cubic-bezier(0, 0, 0.2, 1);
      overflow: hidden;
    }

    .launcher.pos-bottom {
      bottom: 60px;
      left: 12px;
      transform: translateY(15px) scale(0.97);
    }
    .launcher.pos-bottom.active {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .launcher.pos-left {
      top: 12px;
      left: 64px;
      transform: translateX(-15px) scale(0.97);
    }
    .launcher.pos-left.active {
      opacity: 1;
      transform: translateX(0) scale(1);
      pointer-events: auto;
    }

    .launcher.pos-right {
      top: 12px;
      right: 64px;
      transform: translateX(15px) scale(0.97);
    }
    .launcher.pos-right.active {
      opacity: 1;
      transform: translateX(0) scale(1);
      pointer-events: auto;
    }

    .launcher.dragged-active {
      transform: scale(1) !important;
    }

    .launcher-header-drag {
      width: 100%;
      padding-bottom: 12px;
      margin-top: -12px;
      cursor: move;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }

    .launcher-drag-handle {
      width: 40px;
      height: 5px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 3px;
    }

    .launcher-content-scroll {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      padding-right: 4px;
    }

    .launcher-search {
      position: relative;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .launcher-search input {
      width: 100%;
      padding: 14px 70px 14px 44px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      outline: none;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      color: #ffffff;
      font-size: 14px;
    }

    .search-google-logo { position: absolute; left: 16px; width: 18px; height: 18px; }
    .search-right-icons { position: absolute; right: 18px; display: flex; align-items: center; gap: 10px; }

    .default-view { display: flex; flex-direction: column; gap: 20px; }
    .default-view.hidden { display: none; }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #aaa;
      font-weight: 600;
    }

    .recents-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .recent-item {
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.05);
      transition: transform 0.15s ease, background 0.15s;
    }

    .recent-item:hover { transform: translateY(-1px); background: rgba(255, 255, 255, 0.12); }
    .recent-icon { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
    .recent-icon img { width: 22px; height: 22px; }
    .recent-info h4 { font-size: 12px; color: #ffffff; font-weight: 500; }
    .recent-info p { font-size: 10px; color: #aaa; }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 20px 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 20px;
    }

    .app-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #ffffff;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      padding: 6px 2px;
      text-align: center;
      transition: transform 0.15s cubic-bezier(0.2, 0, 0, 1);
    }

    .app-icon:hover { transform: translateY(-3px) scale(1.05); }

    .icon-img {
      width: 38px;
      height: 38px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.4));
    }

    .icon-img img { width: 100%; height: 100%; object-fit: contain; }

    .search-view { display: none; flex-direction: column; gap: 16px; }
    .search-view.active { display: flex; }
    .search-category-title { font-size: 11px; color: #aaa; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }

    .search-result-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.05);
      transition: transform 0.15s ease;
      color: #ffffff;
    }

    .search-result-item:hover { transform: translateX(3px); background: rgba(255, 255, 255, 0.12); }
    .search-result-item img { width: 20px; height: 20px; }

    /* Shelf / Dock */
    .shelf {
      position: fixed;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 1000;
      transition: transform 0.35s cubic-bezier(0.1, 0.9, 0.2, 1);
    }

    .shelf.pos-bottom {
      height: 48px; bottom: 0; left: 0; right: 0;
      flex-direction: row; padding: 0 8px; border-width: 1px 0 0 0;
      transform: translateY(0);
    }
    .shelf.pos-bottom.autohide, .shelf.pos-bottom.app-fullscreen-hide { transform: translateY(100%); }

    .shelf.pos-left {
      width: 52px; top: 0; bottom: 0; left: 0;
      flex-direction: column; padding: 8px 0; border-width: 0 1px 0 0;
      transform: translateX(0);
    }
    .shelf.pos-left.autohide, .shelf.pos-left.app-fullscreen-hide { transform: translateX(-100%); }

    .shelf.pos-right {
      width: 52px; top: 0; bottom: 0; right: 0;
      flex-direction: column; padding: 8px 0; border-width: 0 0 0 1px;
      transform: translateX(0);
    }
    .shelf.pos-right.autohide, .shelf.pos-right.app-fullscreen-hide { transform: translateX(100%); }

    .shelf.autohide.reveal, .shelf.app-fullscreen-hide.reveal { transform: translate(0, 0) !important; }

    .shelf-trigger-zone { position: fixed; z-index: 1100; display: none; }
    .shelf-trigger-zone.active { display: block; }
    .shelf-trigger-zone.pos-bottom { bottom: 0; left: 0; right: 0; height: 8px; }
    .shelf-trigger-zone.pos-left { left: 0; top: 0; bottom: 0; width: 8px; }
    .shelf-trigger-zone.pos-right { right: 0; top: 0; bottom: 0; width: 8px; }

    .shelf-left { display: flex; align-items: center; justify-content: center; }

    .launcher-btn {
      width: 36px; height: 36px; border-radius: 50%; border: none;
      background: rgba(255, 255, 255, 0.1); cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: background 0.15s;
    }

    .launcher-btn:hover { background: rgba(255, 255, 255, 0.25); }
    .launcher-btn::after { content: ''; width: 12px; height: 12px; border: 2px solid #ffffff; border-radius: 50%; box-shadow: 0 0 4px rgba(0,0,0,0.6); }

    .shelf-center { display: flex; gap: 12px; align-items: center; justify-content: center; }

    .shelf.pos-bottom .shelf-center { position: absolute; left: 50%; transform: translateX(-50%); flex-direction: row; }
    .shelf.pos-left .shelf-center, .shelf.pos-right .shelf-center { position: absolute; top: 50%; transform: translateY(-50%); flex-direction: column; }

    .shelf-app-icon {
      position: relative; width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; border-radius: 10px; transition: transform 0.15s, background 0.15s;
    }

    .shelf-app-icon:hover { transform: scale(1.08); background: rgba(255, 255, 255, 0.15); }
    .shelf-app-icon img { width: 28px; height: 28px; object-fit: contain; }

    .shelf-app-icon.active::after {
      content: ''; position: absolute; background: #ffffff;
      box-shadow: 0 0 6px rgba(255,255,255,0.8); border-radius: 2px; transition: all 0.2s ease;
    }

    .shelf.pos-bottom .shelf-app-icon.active::after { bottom: 1px; left: 25%; width: 50%; height: 3px; }
    .shelf.pos-left .shelf-app-icon.active::after { left: 1px; top: 25%; height: 50%; width: 3px; }
    .shelf.pos-right .shelf-app-icon.active::after { right: 1px; top: 25%; height: 50%; width: 3px; }

    .shelf-right { display: flex; align-items: center; gap: 6px; }

    .tray-pill {
      background: rgba(255, 255, 255, 0.1); height: 32px; padding: 0 10px;
      border-radius: 16px; display: flex; align-items: center; justify-content: center;
      gap: 4px; font-size: 11px; font-weight: 600; color: #ffffff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8); cursor: default; white-space: nowrap;
    }

    /* Wallpaper Selection Modal */
    .wallpaper-modal {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.95);
      width: 560px; max-width: 90vw; max-height: 80vh;
      background: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px; padding: 20px; box-shadow: 0 16px 40px rgba(0,0,0,0.6);
      z-index: 2500; display: none; flex-direction: column; gap: 16px;
      opacity: 0; transition: all 0.2s ease;
    }

    .wallpaper-modal.active { display: flex; opacity: 1; transform: translate(-50%, -50%) scale(1); }
    .wallpaper-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .wallpaper-header h3 { font-size: 16px; color: #ffffff; }
    .wallpaper-header-actions { display: flex; align-items: center; gap: 8px; }

    .loop-toggle-btn, .rain-toggle-btn {
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .loop-toggle-btn:hover, .rain-toggle-btn:hover { background: rgba(255, 255, 255, 0.25); }

    .wallpaper-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
      overflow-y: auto; max-height: 340px; padding-right: 4px;
    }

    .wallpaper-option {
      height: 100px; border-radius: 12px; background-size: cover;
      background-position: center; cursor: pointer; border: 2px solid transparent;
      position: relative; overflow: hidden; transition: transform 0.15s, border-color 0.15s;
    }

    .wallpaper-option video { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; pointer-events: none; }
    .wallpaper-option:hover { transform: scale(1.03); border-color: #ffffff; }

    /* Music Player Styles */
    .music-player-pro {
      height: 100%;
      background: #09090b;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .mp-main-layout {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    .mp-sidebar {
      width: 220px;
      background: #000000;
      border-right: 1px solid #1a1a1e;
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .mp-sidebar-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #52525b;
      margin-bottom: 10px;
      padding-left: 10px;
    }

    .mp-nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      color: #a1a1aa;
      transition: all 0.15s ease;
    }

    .mp-nav-item img {
      width: 18px;
      height: 18px;
      object-fit: contain;
    }

    .mp-nav-item:hover, .mp-nav-item.active {
      background: #18181b;
      color: #ffffff;
    }

    .mp-playlists-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 150px;
      overflow-y: auto;
      margin-top: 4px;
    }

    .mp-playlist-link {
      padding: 6px 12px;
      font-size: 12px;
      color: #71717a;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mp-playlist-link:hover { background: #121215; color: #fff; }

    .mp-create-playlist-btn {
      background: none;
      border: 1px dashed #3f3f46;
      color: #a1a1aa;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11px;
      cursor: pointer;
      text-align: center;
      margin-top: 6px;
      transition: all 0.15s;
    }
    .mp-create-playlist-btn:hover { background: #18181b; color: #fff; border-color: #71717a; }

    .mp-content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #070709;
      position: relative;
      overflow: hidden;
    }

    .mp-search-bar-container {
      padding: 16px 24px;
      border-bottom: 1px solid #141417;
      display: flex;
      gap: 12px;
      background: #000000;
    }

    .mp-search-bar-container input {
      flex: 1;
      background: #121215;
      border: 1px solid #27272a;
      border-radius: 10px;
      padding: 10px 16px;
      color: #ffffff;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }

    .mp-search-bar-container input:focus {
      border-color: #52525b;
    }

    .mp-search-bar-container button {
      background: #18181b;
      border: 1px solid #27272a;
      color: #ffffff;
      padding: 0 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s;
    }

    .mp-search-bar-container button img {
      width: 14px;
      height: 14px;
    }

    .mp-search-bar-container button:hover {
      background: #27272a;
    }

    .mp-tracklist-header {
      display: grid;
      grid-template-columns: 48px 1fr 140px 100px 80px;
      padding: 12px 24px;
      font-size: 11px;
      font-weight: 600;
      color: #71717a;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      border-bottom: 1px solid #141417;
    }

    .mp-playlist {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .mp-track-item {
      display: grid;
      grid-template-columns: 48px 1fr 140px 100px 80px;
      align-items: center;
      padding: 8px 12px;
      border-radius: 10px;
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
      position: relative;
    }

    .mp-track-item:hover {
      background: #121215;
      border-color: #27272a;
    }

    .mp-track-item.playing {
      background: #18181b;
      border-color: #3f3f46;
    }

    .mp-track-num {
      font-size: 13px;
      color: #71717a;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mp-track-num img {
      width: 14px;
      height: 14px;
    }

  <!-- Bottom Shelf Trigger Zone -->
  <div class="shelf-trigger-zone pos-bottom" id="shelfTriggerZone"></div>

  <!-- Shelf / Dock -->
  <div class="shelf pos-bottom" id="shelf">
    <div class="shelf-left">
      <button class="launcher-btn" id="launcherBtn" onclick="toggleLauncher(event)"></button>

  <!-- Hidden Master Audio Engine -->
  <audio id="masterAudio" preload="auto"></audio>

  <script>
    const desktop = document.getElementById('desktop');
    const contextMenu = document.getElementById('contextMenu');
    const shelf = document.getElementById('shelf');
    const shelfCenter = document.getElementById('shelfCenter');
    const shelfTriggerZone = document.getElementById('shelfTriggerZone');
    const launcher = document.getElementById('launcherMenu');
    const launcherDragHandle = document.getElementById('launcherDragHandle');
    const wallpaperModal = document.getElementById('wallpaperModal');
    const wallpaperContainer = document.getElementById('desktopWallpaperContainer');
    const altTabOverlay = document.getElementById('altTabOverlay');
    const masterAudio = document.getElementById('masterAudio');
    
    let highestZIndex = 100;
    let currentPosition = 'bottom';
    let isAutohideEnabled = false;
    let isVideoLooping = true;
    let isRainActive = true;
    let currentWallpaperUrl = '';
    let currentWallpaperType = 'image';
    let installedApps = [];
    
    const openApps = {};
    let altTabAppKeys = [];
    let altTabIndex = 0;

    let musicSearchResults = [];
    let currentTrackIdx = -1;
    let isMusicPlaying = false;
    let likedTracks = new Set();
    let userPlaylists = ["Favorites", "Workout Vibes", "Late Night"];
    let savedMusicTracks = [];
    let activeViewMode = 'discover';

    const PNGS = {
      search: "https://img.icons8.com/?size=100&id=132&format=png&color=FFFFFF",
      discover: "https://img.icons8.com/?size=100&id=83220&format=png&color=A1A1AA",
      library: "https://img.icons8.com/?size=100&id=85038&format=png&color=A1A1AA",
      heartOutline: "https://img.icons8.com/?size=100&id=85038&format=png&color=71717A",
      heartFilled: "https://img.icons8.com/?size=100&id=85038&format=png&color=EF4444",
      playBtn: "https://img.icons8.com/?size=100&id=398&format=png&color=000000",
      pauseBtn: "https://img.icons8.com/?size=100&id=85882&format=png&color=000000",
      prevBtn: "https://img.icons8.com/?size=100&id=5716&format=png&color=FFFFFF",
      nextBtn: "https://img.icons8.com/?size=100&id=87484&format=png&color=FFFFFF",
      volume: "https://img.icons8.com/?size=100&id=82883&format=png&color=FFFFFF",
      playRow: "https://img.icons8.com/?size=100&id=85882&format=png&color=FFFFFF",
      more: "https://img.icons8.com/?size=100&id=98963&format=png&color=71717A"
    };

    /* State Persistence Engine */
    function saveSystemState() {
      const state = {
        isAutohideEnabled,
        isRainActive,
        isVideoLooping,
        currentPosition,
        currentWallpaperUrl,
        currentWallpaperType,
        installedApps,
        userPlaylists,
        likedTracks: Array.from(likedTracks),
        savedMusicTracks: musicSearchResults
      };
      localStorage.setItem('chromeos_system_state', JSON.stringify(state));
    }

    function loadSystemState() {
      const saved = localStorage.getItem('chromeos_system_state');
      if (!saved) return;
      try {
        const state = JSON.parse(saved);
        if (state.isAutohideEnabled !== undefined) {
          isAutohideEnabled = state.isAutohideEnabled;
          if (isAutohideEnabled) {
            shelf.classList.add('autohide');
            shelfTriggerZone.classList.add('active');
            const label = document.getElementById('autohideLabel');
            if (label) label.textContent = 'Disable Autohide Shelf';
          }
        }
        if (state.isRainActive !== undefined) {
          isRainActive = state.isRainActive;
          const btn = document.getElementById('rainModalBtn');
          if (btn) btn.textContent = `Rain Effect: ${isRainActive ? 'ON' : 'OFF'}`;
          const canvasElem = document.getElementById('rainCanvas');
          if (canvasElem) canvasElem.style.display = isRainActive ? 'block' : 'none';
        }
        if (state.isVideoLooping !== undefined) {
          isVideoLooping = state.isVideoLooping;
          const btn = document.getElementById('loopVideoModalBtn');
          if (btn) btn.textContent = `Loop Video: ${isVideoLooping ? 'ON' : 'OFF'}`;
        }
        if (state.currentPosition) {
          setShelfPosition(state.currentPosition);
        }
        if (state.currentWallpaperUrl) {
          setWallpaper(state.currentWallpaperUrl, state.currentWallpaperType || 'image', false);
        }
        if (Array.isArray(state.installedApps)) {
          installedApps = state.installedApps;
          installedApps.forEach(app => addInstalledAppToGrid(app.name, app.image, app.url, false));
        }
        if (Array.isArray(state.userPlaylists)) {
          userPlaylists = state.userPlaylists;
        }
        if (Array.isArray(state.likedTracks)) {
          likedTracks = new Set(state.likedTracks);
        }
        if (Array.isArray(state.savedMusicTracks) && state.savedMusicTracks.length > 0) {
          musicSearchResults = state.savedMusicTracks;
        }
      } catch (e) {
        console.error("Failed to load saved state", e);
      }
    }

    /* Message receiver line to add installed apps into OS */
    window.addEventListener('message', function(event) {
      if (event.data && event.data.type === 'INSTALL_APP') {
        const { name, image, url } = event.data;
        addInstalledAppToGrid(name, image, url, true);
      }
    });

    function addInstalledAppToGrid(name, image, url, shouldSave = true) {
      const grid = document.getElementById('mainAppGrid');
      if (!grid) return;

      const appCard = document.createElement('div');
      appCard.className = 'app-icon';
      appCard.onclick = () => openApp(name, image, url);
      appCard.innerHTML = `
        <div class="icon-img"><img src="${image}" alt="${name}"></div>
        <span>${name}</span>
      `;
      grid.appendChild(appCard);

      if (shouldSave) {
        if (!installedApps.some(app => app.name === name && app.url === url)) {
          installedApps.push({ name, image, url });
          saveSystemState();
        }
      }
    }

    function toggleVideoLooping() {
      isVideoLooping = !isVideoLooping;
      const btn = document.getElementById('loopVideoModalBtn');
      if (btn) btn.textContent = `Loop Video: ${isVideoLooping ? 'ON' : 'OFF'}`;

      const bgVideo = wallpaperContainer.querySelector('video');
      if (bgVideo) {
        bgVideo.loop = isVideoLooping;
        bgVideo.muted = true;
      }
      saveSystemState();
    }

    function toggleRainEffect() {
      isRainActive = !isRainActive;
      const btn = document.getElementById('rainModalBtn');
      if (btn) btn.textContent = `Rain Effect: ${isRainActive ? 'ON' : 'OFF'}`;
      const canvasElem = document.getElementById('rainCanvas');
      if (canvasElem) canvasElem.style.display = isRainActive ? 'block' : 'none';
      saveSystemState();
    }

    /* Rain Canvas Engine */
    const canvas = document.getElementById('rainCanvas');
    const ctx = canvas.getContext('2d');
    let raindrops = [];

    function resizeRainCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeRainCanvas);
    resizeRainCanvas();

    class Raindrop {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * -canvas.height;
        this.length = Math.random() * 20 + 10;
        this.speed = Math.random() * 10 + 10;
        this.opacity = Math.random() * 0.3 + 0.15;
      }
      update() {
        this.y += this.speed;
        if (this.y > canvas.height) this.reset();
      }
      draw() {
        ctx.beginPath();
        ctx.strokeStyle = `rgba(255, 255, 255, ${this.opacity})`;
        ctx.lineWidth = 1.2;
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x, this.y + this.length);
        ctx.stroke();
      }
    }

    for (let i = 0; i < 120; i++) raindrops.push(new Raindrop());

    function animateRain() {
      if (isRainActive) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        raindrops.forEach(drop => { drop.update(); drop.draw(); });
      }
      requestAnimationFrame(animateRain);
    }
    animateRain();

    async function fetchGitHubWallpapers() {
      const apiEndpoint = "https://api.github.com/repos/school-rgb/frutiger-os-wallpaper/contents/";
      try {
        const response = await fetch(apiEndpoint);
        if (!response.ok) throw new Error("Network error");
        const files = await response.json();
        const validMediaFiles = files.filter(file => {
          const lowerName = file.name.toLowerCase();
          return lowerName.endsWith('.png') || lowerName.endsWith('.mp4');
        });

        if (validMediaFiles.length > 0) {
          populateWallpaperModal(validMediaFiles);
          if (!currentWallpaperUrl) {
            setWallpaper(validMediaFiles[0].download_url, validMediaFiles[0].name.toLowerCase().endsWith('.mp4') ? 'video' : 'image');
          }
        } else {
          loadFallbackWallpapers();
        }
      } catch (err) {
        loadFallbackWallpapers();
      }
    }

    function loadFallbackWallpapers() {
      const fallbacks = [
        { name: "wallpaper1.png", download_url: "https://raw.githubusercontent.com/school-rgb/frutiger-os-wallpaper/main/Frutiger%20Aero%20Wallpaper%201.png" },
        { name: "wallpaper2.png", download_url: "https://raw.githubusercontent.com/school-rgb/frutiger-os-wallpaper/main/Frutiger%20Aero%20Wallpaper%202.png" }

    // --- NETEASE MUSIC API & FUNCTIONAL AUDIO ENGINE ---
    async function executeMusicSearch(keyword, limit = 25) {
      if (!keyword) return;
      const url = `https://api.qijieya.cn/meting/?type=search&id=${encodeURIComponent(keyword)}&limit=${encodeURIComponent(limit)}&server=netease`;
      
      const playlistElem = document.getElementById('mpPlaylistContainer');
      if (playlistElem) {
        playlistElem.innerHTML = `<div style="padding:30px; text-align:center; color:#71717a; font-size:13px;">Searching tracks for "${keyword}"...</div>`;
      }

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const data = await response.json();
        
        if (Array.isArray(data) && data.length > 0) {
          musicSearchResults = data;
          activeViewMode = 'discover';
          updateSidebarActiveState();
          renderMusicProPlaylist();
          saveSystemState();
        } else {
          if (playlistElem) playlistElem.innerHTML = `<div style="padding:30px; text-align:center; color:#71717a; font-size:13px;">No tracks found for "${keyword}"</div>`;
        }
      } catch (error) {
        console.error("Music API Fetch Error:", error);
        if (playlistElem) playlistElem.innerHTML = `<div style="padding:30px; text-align:center; color:#ef4444; font-size:13px;">Error connecting to NetEase Music API</div>`;
      }
    }

    function triggerMusicSearchFromInput() {
      const input = document.getElementById('mpSearchInput');
      if (input && input.value.trim() !== '') {
        executeMusicSearch(input.value.trim());
      }
    }

    function addTrackToPlaylist(trackIdx, playlistName) {
      const track = musicSearchResults[trackIdx];
      if (!track) return;
      if (!track.playlists) track.playlists = new Set();
      track.playlists.add(playlistName);
      
      const popup = document.getElementById(`popup-${trackIdx}`);
      if (popup) popup.classList.remove('active');
      alert(`Added "${track.name || track.title}" to playlist "${playlistName}"`);
      saveSystemState();

    function renderMusicProPlaylist() {
      const container = document.getElementById('mpPlaylistContainer');
      if (!container) return;

      container.innerHTML = '';

      let listToRender = musicSearchResults;
      if (activeViewMode === 'liked') {
        listToRender = musicSearchResults.filter(t => likedTracks.has(String(t.id)));
      } else if (activeViewMode.startsWith('pl:')) {
        const plName = activeViewMode.substring(3);
        listToRender = musicSearchResults.filter(t => t.playlists && t.playlists.has(plName));
      }

      if (listToRender.length === 0) {
        container.innerHTML = `<div style="padding:40px; text-align:center; color:#71717a; font-size:13px;">No tracks found in this view. Try searching and liking or adding songs to playlists!</div>`;
        return;
      }

      listToRender.forEach((track, displayIdx) => {
        const realIdx = musicSearchResults.indexOf(track);
        const isPlaying = realIdx === currentTrackIdx;
        const trackId = String(track.id || realIdx);
        const isLiked = likedTracks.has(trackId);

        const item = document.createElement('div');
        item.className = `mp-track-item ${isPlaying ? 'playing' : ''}`;
        item.onclick = () => selectTrack(realIdx);

        const coverImg = track.pic 
          ? `<img src="${track.pic}" class="mp-track-cover" alt="cover">` 
          : `<div class="mp-track-cover" style="display:flex;align-items:center;justify-content:center;">🎵</div>`;

        const trackNumDisplay = isPlaying 
          ? `<img src="${PNGS.playRow}" alt="playing">` 
          : (displayIdx + 1);

        let playlistOptionsHtml = '';
        userPlaylists.forEach(pl => {
          playlistOptionsHtml += `<div class="playlist-popup-item" onclick="event.stopPropagation(); addTrackToPlaylist(${realIdx}, '${pl}')"><span>${pl}</span></div>`;
        });

        item.innerHTML = `
          <div class="mp-track-num">${trackNumDisplay}</div>
          <div class="mp-track-info-left">
            ${coverImg}
            <div class="mp-track-names">
              <h5>${track.name || track.title || 'Unknown Title'}</h5>
              <p>${track.artist || track.author || 'Artist'}</p>
            </div>
          </div>
          <div class="mp-track-album">${track.album || 'Single / NetEase'}</div>
          <div class="mp-track-duration">03:45</div>
          <div class="mp-track-actions">
            <button class="mp-action-btn ${isLiked ? 'active' : ''}" onclick="toggleLikeTrack(event, '${trackId}')" title="Like / Unlike">
              <img src="${isLiked ? PNGS.heartFilled : PNGS.heartOutline}" alt="like">
            </button>
            <button class="mp-action-btn" onclick="togglePlaylistMenu(event, ${realIdx})" title="Add to playlist">
              <img src="${PNGS.more}" alt="more">
            </button>

              <div class="playlist-popup-title">Add to Playlist</div>
              ${playlistOptionsHtml}
            </div>
          </div>

        container.appendChild(item);
      });

    function selectTrack(idx) {
      if (idx < 0 || idx >= musicSearchResults.length) return;
      currentTrackIdx = idx;
      const track = musicSearchResults[idx];

      const titleElem = document.getElementById('mpCurrentTitle');
      const artistElem = document.getElementById('mpCurrentArtist');
      const coverElem = document.getElementById('mpCurrentCover');
      
      if (titleElem) titleElem.textContent = track.name || track.title || 'Unknown Track';
      if (artistElem) artistElem.textContent = track.artist || track.author || 'NetEase Artist';
      
      const recentTitle = document.getElementById('recentTrackTitle');
      if (recentTitle) recentTitle.textContent = track.name || track.title;

      if (coverElem) {
        if (track.pic) {
          coverElem.innerHTML = `<img src="${track.pic}" alt="cover">`;
        } else {
          coverElem.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;">🎵</div>`;
        }
      }

      if (track.url) {
        masterAudio.src = track.url;
        masterAudio.play().then(() => {
          isMusicPlaying = true;
          const mainBtnImg = document.getElementById('mpPlayBtnImg');
          if (mainBtnImg) mainBtnImg.src = PNGS.pauseBtn;
        }).catch(err => {
          console.error("Audio playback error:", err);
        });
      }

      renderMusicProPlaylist();
    }

    function togglePlayMusicPro() {
      if (currentTrackIdx === -1 && musicSearchResults.length > 0) {
        selectTrack(0);
        return;
      }
      
      if (masterAudio.paused) {
        if (!masterAudio.src && musicSearchResults[currentTrackIdx]?.url) {
          masterAudio.src = musicSearchResults[currentTrackIdx].url;
        }
        masterAudio.play().then(() => {
          isMusicPlaying = true;
          const mainBtnImg = document.getElementById('mpPlayBtnImg');
          if (mainBtnImg) mainBtnImg.src = PNGS.pauseBtn;
        }).catch(e => console.log(e));
      } else {
        masterAudio.pause();
        isMusicPlaying = false;
        const mainBtnImg = document.getElementById('mpPlayBtnImg');
        if (mainBtnImg) mainBtnImg.src = PNGS.playBtn;
      }
    }

    function playNextTrack() {
      if (musicSearchResults.length === 0) return;
      currentTrackIdx = (currentTrackIdx + 1) % musicSearchResults.length;
      selectTrack(currentTrackIdx);
    }

    function playPrevTrack() {
      if (musicSearchResults.length === 0) return;
      currentTrackIdx = (currentTrackIdx - 1 + musicSearchResults.length) % musicSearchResults.length;
      selectTrack(currentTrackIdx);
    }

    function setMusicVolume(val) {
      masterAudio.volume = val / 100;

    function seekMusicBar(e) {
      if (!masterAudio.duration) return;
      const progressBar = e.currentTarget;
      const rect = progressBar.getBoundingClientRect();
      const offsetX = e.clientX - rect.left;
      const pct = offsetX / rect.width;
      masterAudio.currentTime = pct * masterAudio.duration;
    }

    masterAudio.addEventListener('timeupdate', () => {
      if (!masterAudio.duration) return;
      const pct = (masterAudio.currentTime / masterAudio.duration) * 100;
      const fill = document.getElementById('mpProgressFill');
      if (fill) fill.style.width = `${pct}%`;

      const curMin = Math.floor(masterAudio.currentTime / 60);
      const curSec = Math.floor(masterAudio.currentTime % 60).toString().padStart(2, '0');
      const durMin = Math.floor(masterAudio.duration / 60) || 0;
      const durSec = Math.floor(masterAudio.duration % 60).toString().padStart(2, '0');
      
      const timeElem = document.getElementById('mpCurrentTime');
      const durElem = document.getElementById('mpCurrentDuration');
      if (timeElem) timeElem.textContent = `${curMin}:${curSec}`;
      if (durElem) durElem.textContent = `${durMin}:${durSec}`;
    });

    masterAudio.addEventListener('ended', () => {
      playNextTrack();
    });

    // Calculator Logic
    let calcVal = '0';
    function calcInput(char) {
      const display = document.getElementById('calcDisplay');
      if (!display) return;

      if (char === 'C') {
        calcVal = '0';
      } else if (char === '=') {
        try { calcVal = eval(calcVal).toString(); } catch { calcVal = 'Error'; }
      } else {
        if (calcVal === '0' || calcVal === 'Error') calcVal = char;
        else calcVal += char;
      }
      display.textContent = calcVal;
    }

            bringToFront(app.element);
            updateShelfAutoHideState();

        dockIcon.onclick = () => {
          if (app.isMinimized || app.element.classList.contains('hidden')) {
            app.element.classList.remove('hidden');
            app.isMinimized = false;
            bringToFront(app.element);
          } else if (app.element.style.zIndex == highestZIndex) {
            fakeCloseApp(appId);
          } else {
            bringToFront(app.element);
          }
          updateShelfAutoHideState();
          renderDockItems();
        };

        shelfCenter.appendChild(dockIcon);
      });
    }

    function bringToFront(win) {
      highestZIndex++;
      win.style.zIndex = highestZIndex;
    }

    function fakeCloseApp(appId) {
      const app = openApps[appId];
      if (app) {
        app.element.classList.add('hidden');
        app.isMinimized = true;
        updateShelfAutoHideState();
        renderDockItems();
      }
    }

    function closeApp(appId) {
      const app = openApps[appId];
      if (app) {
        if (appId === 'win-music-studio-pro' || app.targetUrl === 'native:music') {
          masterAudio.pause();
          masterAudio.currentTime = 0;
          masterAudio.removeAttribute('src');
          masterAudio.load();
          isMusicPlaying = false;

          const mainBtnImg = document.getElementById('mpPlayBtnImg');
          if (mainBtnImg) {
            mainBtnImg.src = PNGS.playBtn;
          }
        }

        const iframe = app.element.querySelector('iframe');
        if (iframe) {
          iframe.src = 'about:blank';
        }

        app.element.remove();
        delete openApps[appId];
        updateShelfAutoHideState();
        renderDockItems();
      }
    }

    function toggleWindowMode(appId) {
      const app = openApps[appId];
      if (app) {
        app.element.classList.toggle('windowed');
        if (!app.element.classList.contains('windowed')) {
          app.element.style.top = '0px';
          app.element.style.left = '0px';
          app.element.style.width = '100vw';
          app.element.style.height = '100vh';
        } else {
          app.element.style.width = '950px';
          app.element.style.height = '600px';
          app.element.style.left = `${Math.max(20, (window.innerWidth - 950) / 2)}px`;
          app.element.style.top = `${Math.max(20, (window.innerHeight - 600) / 2)}px`;
        }
        updateShelfAutoHideState();
      }
    }

    function setShelfPosition(pos) {
      shelf.className = `shelf pos-${pos}`;
      shelfTriggerZone.className = `shelf-trigger-zone pos-${pos}`;
      launcher.className = `launcher pos-${pos}` + (launcher.classList.contains('active') ? ' active' : '');
      launcher.style.top = '';
      launcher.style.left = '';
      launcher.style.bottom = '';
      launcher.style.right = '';
      currentPosition = pos;

      if (isAutohideEnabled) {
        shelf.classList.add('autohide');
        shelfTriggerZone.classList.add('active');
      }

      renderDockItems();
      saveSystemState();
    }

    function toggleAlwaysHideShelf() {
      isAutohideEnabled = !isAutohideEnabled;
      const label = document.getElementById('autohideLabel');

      if (isAutohideEnabled) {
        shelf.classList.add('autohide');
        shelfTriggerZone.classList.add('active');
        label.textContent = 'Disable Autohide Shelf';
      } else {
        shelf.classList.remove('autohide', 'reveal');
        shelfTriggerZone.classList.remove('active');
        label.textContent = 'Autohide Shelf';
      }
      updateShelfAutoHideState();
      saveSystemState();
    }

    function updateShelfAutoHideState() {
      const activeFullscreenApp = document.querySelector('.app-window:not(.windowed):not(.hidden)');
      if (activeFullscreenApp || isAutohideEnabled) {
        shelf.classList.add('app-fullscreen-hide');
        shelfTriggerZone.classList.add('active');
      } else {
        shelf.classList.remove('app-fullscreen-hide', 'reveal');
        if (!isAutohideEnabled) {
          shelfTriggerZone.classList.remove('active');
        }
      }
    }

    shelfTriggerZone.addEventListener('mouseenter', () => shelf.classList.add('reveal'));
    shelf.addEventListener('mouseleave', () => {
      if (isAutohideEnabled || document.querySelector('.app-window:not(.windowed):not(.hidden)')) {
        shelf.classList.remove('reveal');
      }
    });

    function openWallpaperModal() {
      wallpaperModal.classList.add('active');
      contextMenu.classList.remove('active');
    }

    function closeWallpaperModal() {
      wallpaperModal.classList.remove('active');
    }

    /* Fixed Universal Draggable Helper */
    function makeDraggable(element, handle) {
      let isDragging = false, startX, startY, initialLeft, initialTop;

      handle.addEventListener('mousedown', (e) => {
        if (e.target.closest('.win-btn')) return;

        isDragging = true;
        document.body.classList.add('is-interacting');
        element.classList.add('dragging');
        
        if (element.classList.contains('launcher')) {
          element.classList.add('dragged-active');
        }

        startX = e.clientX; 
        startY = e.clientY;
        
        const rect = element.getBoundingClientRect();
        initialLeft = rect.left; 
        initialTop = rect.top;

        element.style.left = `${initialLeft}px`;
        element.style.top = `${initialTop}px`;
        element.style.bottom = 'auto';
        element.style.right = 'auto';

        const onMouseMove = (e) => {
          if (!isDragging) return;
          const deltaX = e.clientX - startX;
          const deltaY = e.clientY - startY;
          element.style.left = `${initialLeft + deltaX}px`;
          element.style.top = `${initialTop + deltaY}px`;
        };

        const onMouseUp = () => {
          isDragging = false;
          document.body.classList.remove('is-interacting');
          element.classList.remove('dragging');
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('mouseup', onMouseUp);
        };

        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onMouseUp);
      });
    }

    /* Fixed Universal Resizable Helper */
    function makeResizable(element) {
      const handles = element.querySelectorAll('.resize-handle');
      handles.forEach(handle => {
        handle.addEventListener('mousedown', (e) => {
          e.preventDefault(); 
          e.stopPropagation();
          
          document.body.classList.add('is-interacting');
          element.classList.add('resizing');
          
          let startX = e.clientX;
          let startY = e.clientY;
          let rect = element.getBoundingClientRect();
          let startWidth = rect.width;
          let startHeight = rect.height;
          let startLeft = rect.left;
          let startTop = rect.top;

          element.style.left = `${startLeft}px`;
          element.style.top = `${startTop}px`;
          element.style.bottom = 'auto';
          element.style.right = 'auto';

          const doResize = (e) => {
            let dx = e.clientX - startX;
            let dy = e.clientY - startY;

            if (handle.classList.contains('e') || handle.classList.contains('se') || handle.classList.contains('ne')) {
              element.style.width = `${Math.max(280, startWidth + dx)}px`;
            }
            if (handle.classList.contains('s') || handle.classList.contains('se') || handle.classList.contains('sw')) {
              element.style.height = `${Math.max(180, startHeight + dy)}px`;
            }
            if (handle.classList.contains('w') || handle.classList.contains('nw') || handle.classList.contains('sw')) {
              let newWidth = startWidth - dx;
              if (newWidth > 280) { 
                element.style.width = `${newWidth}px`; 
                element.style.left = `${startLeft + dx}px`; 
              }
            }
            if (handle.classList.contains('n') || handle.classList.contains('nw') || handle.classList.contains('ne')) {
              let newHeight = startHeight - dy;
              if (newHeight > 180) { 
                element.style.height = `${newHeight}px`; 
                element.style.top = `${startTop + dy}px`; 
              }
            }
          };

          const stopResize = () => {
            document.body.classList.remove('is-interacting');
            element.classList.remove('resizing');
            window.removeEventListener('mousemove', doResize);
            window.removeEventListener('mouseup', stopResize);
          };

          window.addEventListener('mousemove', doResize);
          window.addEventListener('mouseup', stopResize);
        });
      });
    }

    makeDraggable(launcher, launcherDragHandle);
    makeResizable(launcher);

    window.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      const menuWidth = contextMenu.offsetWidth || 220;
      const menuHeight = contextMenu.offsetHeight || 180;
      let posX = e.clientX, posY = e.clientY;

      if (posX + menuWidth > window.innerWidth) posX = window.innerWidth - menuWidth - 10;
      if (posY + menuHeight > window.innerHeight) posY = window.innerHeight - menuHeight - 10;

      contextMenu.style.left = `${posX}px`; contextMenu.style.top = `${posY}px`;
      contextMenu.classList.add('active');
    });

    window.addEventListener('click', (e) => {
      if (!contextMenu.contains(e.target)) {
        contextMenu.classList.remove('active');
      }

      if (wallpaperModal.classList.contains('active') && !wallpaperModal.contains(e.target)) {
        if (!e.target.closest('.context-item')) {
          closeWallpaperModal();
        }
      }

      document.querySelectorAll('.playlist-popup-menu').forEach(m => {
        if (!m.contains(e.target) && !e.target.closest('.mp-action-btn')) {
          m.classList.remove('active');
        }
      });
    });

    function toggleLauncher(e) {
      if (e) e.stopPropagation();
      launcher.classList.toggle('active');
      if (launcher.classList.contains('active')) {
        bringToFront(launcher);
      }
    }

    desktop.addEventListener('click', () => launcher.classList.remove('active'));

    const searchInput = document.getElementById('searchInput');
    const defaultView = document.getElementById('defaultView');
    const searchView = document.getElementById('searchView');
    const bestMatchText = document.getElementById('bestMatchText');
    const googleSearchText = document.getElementById('googleSearchText');

    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.trim();
      if (query.length > 0) {
        defaultView.classList.add('hidden'); searchView.classList.add('active');
        bestMatchText.textContent = `${query} - Apps`;
        googleSearchText.textContent = `${query} - Google Search`;
      } else {
        defaultView.classList.remove('hidden'); searchView.classList.remove('active');
      }
    });

    loadSystemState();
    fetchGitHubWallpapers();
  </script>
</body>
</html>
