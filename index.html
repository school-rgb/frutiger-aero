<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Splash Screen</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #splashContainer {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            cursor: pointer;
        }
        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #mainFrame {
            display: none;
            width: 100vw;
            height: 100vh;
            border: none;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 999;
        }
    </style>
</head>
<body>

    <div id="splashContainer">
        <img id="splashImage" src="Add a little bit of body text (2).png" alt="Splash">
    </div>

    <iframe id="mainFrame"></iframe>

    <audio id="soundEffect" src="win95.mp3"></audio>

    <script>
        let clickCount = 0;
        let isTriggered = false;
        const mainFile = "main.html";

        window.addEventListener("click", function(event) {
            if (isTriggered) return;

            clickCount++;
            
            if (clickCount === 2) {
                isTriggered = true;

                const sound = document.getElementById("soundEffect");
                sound.play().catch(error => {
                    console.log("Audio play blocked or failed:", error);
                });

                const splash = document.getElementById("splashContainer");
                const frame = document.getElementById("mainFrame");

                splash.style.display = "none";
                frame.src = mainFile;
                frame.style.display = "block";
            }
        });
    </script>
</body>
</html>
