<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Splash Screen</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
        }
        #splashContainer {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        img {
            max-width: 100%;
            max-height: 100vh;
            object-fit: contain;
        }
        /* Hidden iframe that will take over the screen when triggered */
        #mainFrame {
            display: none;
            width: 100vw;
            height: 100vh;
            border: none;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 999;
        }
    </style>
</head>
<body>

    <div id="splashContainer">
        <!-- Replace 'your-image.png' with your actual image file name -->
        <img id="splashImage" src="Add a little bit of body text (2).png" alt="Splash">
    </div>

    <!-- This will hold your main HTML file inside this page -->
    <iframe id="main.html"></iframe>

    <!-- Replace 'your-sound.mp3' with your actual MP3 file name -->
    <audio id="soundEffect" src="your-sound.mp3"></audio>

    <script>
        let enterPressCount = 0;
        let isLoaded = false;
        const mainFile = "main.html"; // Your main HTML file

        function openInside() {
            if (isLoaded) return;
            isLoaded = true;

            const splash = document.getElementById("splashContainer");
            const frame = document.getElementById("mainFrame");

            splash.style.display = "none";
            frame.src = mainFile;
            frame.style.display = "block";
        }

        window.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                enterPressCount++;
                
                if (enterPressCount === 2) {
                    const sound = document.getElementById("soundEffect");
                    sound.play().catch(error => {
                        console.log("Audio play blocked or failed:", error);
                    });

                    // Open the file inside once the sound ends
                    sound.onended = openInside;

                    // Fallback timer (1.5 seconds) in case the sound fails or doesn't trigger onended
                    setTimeout(openInside, 1500);
                }
            }
        });
    </script>
</body>
</html>
