<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <style>
    /* IMPORTING YOUR CUSTOM FONT */
    @font-face {
      font-family: 'CustomFont';
      src: url('Electroharmonix.otf') format('opentype');
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Google Sans', Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
    }

    body {
      height: 100vh;
      overflow: hidden;
      background: #000000;
    }

    #desktopWallpaperContainer {
      position: absolute;
      inset: 0;
      z-index: 0; /* Background layer */
      overflow: hidden;
      pointer-events: none;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    #desktopWallpaperContainer video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      inset: 0;
    }

    /* --- PLAIN WHITE DAY DISPLAY (POSITIONED AT TOP-CENTER) --- */
    #dayDisplay {
      position: absolute;
      left: 50%;
      top: 20px;
      transform: translateX(-50%);
      color: #ffffff;
      font-family: 'CustomFont', sans-serif;
      font-size: 4rem;
      z-index: 1; /* ONLY overlaps wallpaper */
      cursor: grab;
      text-shadow: none;
      background: transparent;
      border: none;
    }

    #dayDisplay.dragging {
      cursor: grabbing;
    }

    #rainCanvas {
      position: absolute;
      inset: 0;
      z-index: 2; /* Rain is above the day display */
      pointer-events: none;
      width: 100%;
      height: 100%;
    }

    .desktop {
      height: 100vh;
      width: 100vw;
      position: relative;
      overflow: hidden;
      z-index: 3; /* Desktop, apps, and everything else sit above */
    }

    /* --- WINDOW SYSTEM STYLES --- */
    .app-window {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #09090b;
      border-radius: 0;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      z-index: 800;
      overflow: hidden;
      border: none;
      transition: width 0.2s cubic-bezier(0.2, 0, 0, 1), height 0.2s cubic-bezier(0.2, 0, 0, 1);
    }

    .app-window.windowed {
      width: 950px;
      height: 600px;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 10;
    }

    .app-window.dragging, .app-window.resizing,
    .launcher.dragging, .launcher.resizing {
      transition: none !important;
    }

    .app-window.hidden {
      display: none !important;
    }

    .window-header {
      height: 40px;
      background: #050505;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      cursor: move;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
    }

    .window-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 500;
      color: #ffffff;
    }

    .window-title img {
      width: 18px;
      height: 18px;
      border-radius: 4px;
    }

    .window-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .win-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 12px;
      color: #ffffff;
      transition: background 0.15s;
    }

    .win-btn img {
      width: 14px;
      height: 14px;
      object-fit: contain;
      filter: invert(1);
    }

    .win-btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .win-btn.close:hover {
      background: #e81123;
      color: white;
    }

    .window-body {
      flex: 1;
      padding: 0;
      overflow: hidden;
      position: relative;
      background: #000000;
    }

    .window-body iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    body.is-interacting iframe {
      pointer-events: none !important;
    }

    /* Resizable Handles */
    .resize-handle { position: absolute; z-index: 999; display: none; }
    .app-window.windowed .resize-handle, .launcher .resize-handle { display: block; }
    .resize-handle.n  { top: -4px; left: 0; right: 0; height: 8px; cursor: ns-resize; }
    .resize-handle.s  { bottom: -4px; left: 0; right: 0; height: 8px; cursor: ns-resize; }
    .resize-handle.w  { top: 0; bottom: 0; left: -4px; width: 8px; cursor: ew-resize; }
    .resize-handle.e  { top: 0; bottom: 0; right: -4px; width: 8px; cursor: ew-resize; }
    .resize-handle.nw { top: -4px; left: -4px; width: 12px; height: 12px; cursor: nwse-resize; }
    .resize-handle.ne { top: -4px; right: -4px; width: 12px; height: 12px; cursor: nesw-resize; }
    .resize-handle.sw { bottom: -4px; left: -4px; width: 12px; height: 12px; cursor: nesw-resize; }
    .resize-handle.se { bottom: -4px; right: -4px; width: 12px; height: 12px; cursor: nwse-resize; }

    /* Right Click Context Menu */
    .context-menu {
      position: absolute;
      width: 220px;
      background: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      z-index: 1500;
      display: none;
      flex-direction: column;
    }

    .context-menu.active { display: flex; }

    .context-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      font-size: 13px;
      color: #ffffff;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.10s ease;
      position: relative;
    }

    .context-item:hover { background: rgba(255, 255, 255, 0.12); }
    .context-icon { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; opacity: 0.8; }
    .context-label { flex: 1; }
    .context-arrow { font-size: 10px; color: #888888; }

    .submenu {
      position: absolute;
      left: 100%;
      top: 0;
      width: 160px;
      background: rgba(18, 18, 18, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      display: none;
      flex-direction: column;
    }

    .context-item:hover .submenu { display: flex; }

    /* Launcher Menu - Standalone Floating Window */
    .launcher {
      position: fixed;
      width: 620px;
      height: 580px;
      min-width: 320px;
      min-height: 350px;
      background: rgba(12, 12, 12, 0.85);
      backdrop-filter: blur(35px);
      -webkit-backdrop-filter: blur(35px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      z-index: 1200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s cubic-bezier(0, 0, 0.2, 1), transform 0.25s cubic-bezier(0, 0, 0.2, 1);
      overflow: hidden;
    }

    .launcher.pos-bottom {
      bottom: 60px;
      left: 12px;
      transform: translateY(15px) scale(0.97);
    }
    .launcher.pos-bottom.active {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .launcher.pos-left {
      top: 12px;
      left: 64px;
      transform: translateX(-15px) scale(0.97);
    }
    .launcher.pos-left.active {
      opacity: 1;
      transform: translateX(0) scale(1);
      pointer-events: auto;
    }

    .launcher.pos-right {
      top: 12px;
      right: 64px;
      transform: translateX(15px) scale(0.97);
    }
    .launcher.pos-right.active {
      opacity: 1;
      transform: translateX(0) scale(1);
      pointer-events: auto;
    }

    .launcher.dragged-active {
      transform: scale(1) !important;
    }

    .launcher-header-drag {
      width: 100%;
      padding-bottom: 12px;
      margin-top: -12px;
      cursor: move;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }

    .launcher-drag-handle {
      width: 40px;
      height: 5px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 3px;
    }

    .launcher-content-scroll {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      padding-right: 4px;
    }

    .launcher-search {
      position: relative;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .launcher-search input {
      width: 100%;
      padding: 14px 20px 14px 44px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      outline: none;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      color: #ffffff;
      font-size: 14px;
    }

    .search-app-icon { position: absolute; left: 16px; width: 18px; height: 18px; opacity: 0.7; }

    .default-view { display: flex; flex-direction: column; gap: 20px; }
    .default-view.hidden { display: none; }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 20px 16px;
      padding-top: 6px;
    }

    .app-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #ffffff;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      padding: 6px 2px;
      text-align: center;
      transition: transform 0.15s cubic-bezier(0.2, 0, 0, 1);
    }

    .app-icon:hover { transform: translateY(-3px) scale(1.05); }

    .icon-img {
      width: 48px;
      height: 48px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.4));
      border-radius: 12px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.05);
    }

    .icon-img img { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
      border-radius: 12px; 
    }

    .search-view { display: none; flex-direction: column; gap: 16px; }
    .search-view.active { display: flex; }
    .search-category-title { font-size: 11px; color: #aaa; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }

    .search-result-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.05);
      transition: transform 0.15s ease;
      color: #ffffff;
    }

    .search-result-item:hover { transform: translateX(3px); background: rgba(255, 255, 255, 0.12); }
    .search-result-item img { width: 24px; height: 24px; border-radius: 6px; object-fit: cover; }

    /* Shelf / Dock */
    .shelf {
      position: fixed;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 1000;
      transition: transform 0.35s cubic-bezier(0.1, 0.9, 0.2, 1);
    }

    .shelf.pos-bottom {
      height: 48px; bottom: 0; left: 0; right: 0;
      flex-direction: row; padding: 0 8px; border-width: 1px 0 0 0;
      transform: translateY(0);
    }
    .shelf.pos-bottom.autohide, .shelf.pos-bottom.app-fullscreen-hide { transform: translateY(100%); }

    .shelf.pos-left {
      width: 52px; top: 0; bottom: 0; left: 0;
      flex-direction: column; padding: 8px 0; border-width: 0 1px 0 0;
      transform: translateX(0);
    }
    .shelf.pos-left.autohide, .shelf.pos-left.app-fullscreen-hide { transform: translateX(-100%); }

    .shelf.pos-right {
      width: 52px; top: 0; bottom: 0; right: 0;
      flex-direction: column; padding: 8px 0; border-width: 0 0 0 1px;
      transform: translateX(0);
    }
    .shelf.pos-right.autohide, .shelf.pos-right.app-fullscreen-hide { transform: translateX(100%); }

    .shelf.autohide.reveal, .shelf.app-fullscreen-hide.reveal { transform: translate(0, 0) !important; }

    .shelf-trigger-zone { position: fixed; z-index: 1100; display: none; }
    .shelf-trigger-zone.active { display: block; }
    .shelf-trigger-zone.pos-bottom { bottom: 0; left: 0; right: 0; height: 8px; }
    .shelf-trigger-zone.pos-left { left: 0; top: 0; bottom: 0; width: 8px; }
    .shelf-trigger-zone.pos-right { right: 0; top: 0; bottom: 0; width: 8px; }

    .shelf-left { display: flex; align-items: center; justify-content: center; }

    .launcher-btn {
      width: 36px; height: 36px; border-radius: 50%; border: none;
      background: rgba(255, 255, 255, 0.1); cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: background 0.15s;
    }

    .launcher-btn:hover { background: rgba(255, 255, 255, 0.25); }
    .launcher-btn::after { content: ''; width: 12px; height: 12px; border: 2px solid #ffffff; border-radius: 50%; box-shadow: 0 0 4px rgba(0,0,0,0.6); }

    .shelf-center { display: flex; gap: 12px; align-items: center; justify-content: center; }

    .shelf.pos-bottom .shelf-center { position: absolute; left: 50%; transform: translateX(-50%); flex-direction: row; }
    .shelf.pos-left .shelf-center, .shelf.pos-right .shelf-center { position: absolute; top: 50%; transform: translateY(-50%); flex-direction: column; }

    .shelf-app-icon {
      position: relative; width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; border-radius: 10px; transition: transform 0.15s, background 0.15s;
      overflow: hidden;
    }

    .shelf-app-icon:hover { transform: scale(1.08); background: rgba(255, 255, 255, 0.15); }
    .shelf-app-icon img { width: 28px; height: 28px; object-fit: cover; border-radius: 8px; }

    .shelf-app-icon.active::after {
      display: none !important;
    }

    .shelf-right { display: flex; align-items: center; gap: 6px; }

    .tray-pill {
      background: rgba(255, 255, 255, 0.1); height: 32px; padding: 0 10px;
      border-radius: 16px; display: flex; align-items: center; justify-content: center;
      gap: 4px; font-size: 11px; font-weight: 600; color: #ffffff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8); cursor: default; white-space: nowrap;
    }

    /* Wallpaper Selection Modal */
    .wallpaper-modal {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.95);
      width: 560px; max-width: 90vw; max-height: 80vh;
      background: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px; padding: 20px; box-shadow: 0 16px 40px rgba(0,0,0,0.6);
      z-index: 2500; display: none; flex-direction: column; gap: 16px;
      opacity: 0; transition: all 0.2s ease;
    }

    .wallpaper-modal.active { display: flex; opacity: 1; transform: translate(-50%, -50%) scale(1); }
    .wallpaper-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .wallpaper-header h3 { font-size: 16px; color: #ffffff; }
    .wallpaper-header-actions { display: flex; align-items: center; gap: 8px; }

    .loop-toggle-btn, .rain-toggle-btn {
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .loop-toggle-btn:hover, .rain-toggle-btn:hover { background: rgba(255, 255, 255, 0.25); }

    .wallpaper-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
      overflow-y: auto; max-height: 340px; padding-right: 4px;
    }

    .wallpaper-option {
      height: 100px; border-radius: 12px; background-size: cover;
      background-position: center; cursor: pointer; border: 2px solid transparent;
      position: relative; overflow: hidden; transition: transform 0.15s, border-color 0.15s;
    }

    .wallpaper-option video { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; pointer-events: none; }
    .wallpaper-option:hover { transform: scale(1.03); border-color: #ffffff; }

    /* Alt-Tab Overlay */
    .alttab-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(15px);
      z-index: 5000; display: none; align-items: center; justify-content: center; gap: 20px; padding: 40px;
    }
    .alttab-overlay.active { display: flex; }
    .alttab-card {
      width: 180px; height: 140px; background: #181818; border-radius: 14px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
      cursor: pointer; border: 2px solid #2a2a2a; transition: transform 0.15s, border-color 0.15s;
    }
    .alttab-card.selected { border-color: #ffffff; transform: scale(1.08); background: #222222; }
    .alttab-card img { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; }
    .alttab-card span { font-size: 13px; font-weight: 600; color: #ffffff; text-align: center; }
  </style>
</head>
<body>

  <div id="desktopWallpaperContainer"></div>

  <div id="dayDisplay"></div>

  <canvas id="rainCanvas"></canvas>

  <div class="desktop" id="desktop"></div>

  <div class="alttab-overlay" id="altTabOverlay"></div>

  <div class="wallpaper-modal" id="wallpaperModal">
    <div class="wallpaper-header">
      <h3>Select Media Wallpaper</h3>
      <div class="wallpaper-header-actions">
        <button class="loop-toggle-btn" id="loopVideoModalBtn" onclick="toggleVideoLooping()">Loop Video: ON</button>
        <button class="rain-toggle-btn" id="rainModalBtn" onclick="toggleRainEffect()">Rain Effect: ON</button>
        <button class="win-btn close" onclick="closeWallpaperModal()">✕</button>
      </div>
    </div>
    <div class="wallpaper-grid" id="wallpaperGridContainer"></div>
  </div>

  <div class="context-menu" id="appContextMenu">
    <div class="context-item" id="deleteAppBtn" style="color: #ff5555;">
      <div class="context-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff5555" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
      </div>
      <span class="context-label">Delete this app</span>
    </div>
  </div>

  <div class="context-menu" id="contextMenu">
    <div class="context-item" onclick="toggleAlwaysHideShelf()">
      <div class="context-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2"><rect x="2" y="16" width="20" height="5" rx="2"/><rect x="2" y="3" width="20" height="10" rx="2"/></svg>
      </div>
      <span class="context-label" id="autohideLabel">Autohide Shelf</span>
    </div>
    <div class="context-item">
      <div class="context-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2"><rect x="2" y="15" width="20" height="6" rx="2"/><line x1="6" y1="18" x2="8" y2="18"/><line x1="11" y1="18" x2="13" y2="18"/><line x1="16" y1="18" x2="18" y2="18"/></svg>
      </div>
      <span class="context-label">Shelf position</span>
      <span class="context-arrow">›</span>
      <div class="submenu">
        <div class="context-item" onclick="setShelfPosition('bottom')">Bottom</div>
        <div class="context-item" onclick="setShelfPosition('left')">Left</div>
        <div class="context-item" onclick="setShelfPosition('right')">Right</div>
      </div>
    </div>
    <div class="context-item" onclick="openWallpaperModal()">
      <div class="context-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
      </div>
      <span class="context-label">Set wallpaper & style</span>
    </div>
  </div>

  <div class="launcher pos-bottom" id="launcherMenu">
    <div class="resize-handle n"></div>
    <div class="resize-handle s"></div>
    <div class="resize-handle w"></div>
    <div class="resize-handle e"></div>
    <div class="resize-handle nw"></div>
    <div class="resize-handle ne"></div>
    <div class="resize-handle sw"></div>
    <div class="resize-handle se"></div>

    <div class="launcher-header-drag" id="launcherDragHandle" title="Drag to move launcher">
      <div class="launcher-drag-handle"></div>
    </div>
    
    <div class="launcher-search">
      <img src="https://img.icons8.com/color/48/search--v1.png" class="search-app-icon" alt="Search">
      <input type="text" id="searchInput" placeholder="Search shortcuts and apps...">
    </div>

    <div class="launcher-content-scroll">
      <div class="default-view" id="defaultView">
        <div class="app-grid" id="mainAppGrid">

  <div class="shelf-trigger-zone pos-bottom" id="shelfTriggerZone"></div>

  <div class="shelf pos-bottom" id="shelf">
    <div class="shelf-left">
      <button class="launcher-btn" id="launcherBtn" onclick="toggleLauncher(event)"></button>
    </div>
    
    <div class="shelf-center" id="shelfCenter"></div>

    <div class="shelf-right">
      <div class="tray-pill">
        <span id="clockTime">12:00</span>
      </div>
    </div>
  </div>

  <script>
    // --- LISTEN FOR MESSAGES FROM APP STORE IFRAME ---
    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'INSTALL_APP') {
        const { name, icon, url, code } = event.data.app;
        installAppToOS(name, icon, url, code);
      }
    });

    function installAppToOS(name, icon, url, code) {
      const mainAppGrid = document.getElementById('mainAppGrid');
      if (!mainAppGrid) return;

      // Prevent duplicate installs
      const existing = Array.from(mainAppGrid.querySelectorAll('.app-icon span')).some(span => span.textContent === name);
      if (existing) {
        alert('App is already installed!');
        return;
      }

      let finalTarget = url;

      // If raw HTML code was provided, convert it into a Data URL
      if (!finalTarget && code) {
        finalTarget = 'data:text/html;charset=utf-8,' + encodeURIComponent(code);
      }

      // Create grid icon
      const el = document.createElement('div');
      el.className = 'app-icon';
      el.setAttribute('onclick', `openApp('${name}', '${icon}', '${finalTarget}')`);
      el.innerHTML = `<div class="icon-img"><img src="${icon}" alt="${name}"></div><span>${name}</span>`;
      
      mainAppGrid.appendChild(el);

      // Save changes permanently and update UI
      saveState();
      updateInstalledApps();
    }

    const desktop = document.getElementById('desktop');
    const contextMenu = document.getElementById('contextMenu');
    const appContextMenu = document.getElementById('appContextMenu');
    const shelf = document.getElementById('shelf');
    const shelfCenter = document.getElementById('shelfCenter');
    const shelfTriggerZone = document.getElementById('shelfTriggerZone');
    const launcher = document.getElementById('launcherMenu');
    const launcherDragHandle = document.getElementById('launcherDragHandle');
    const wallpaperModal = document.getElementById('wallpaperModal');
    const wallpaperContainer = document.getElementById('desktopWallpaperContainer');
    const altTabOverlay = document.getElementById('altTabOverlay');
    const dayDisplay = document.getElementById('dayDisplay');
    const wg = document.getElementById('wallpaperGridContainer');
    
    let highestZIndex = 100;
    let currentPosition = 'bottom';
    let isAutohideEnabled = false;
    let isVideoLooping = true;
    let isRainActive = true;
    let currentWallpaperUrl = '';
    let currentWallpaperType = 'image';
    let installedApps = [];
    let wallpapers = [];
    
    const openApps = {};
    let altTabAppKeys = [];
    let altTabIndex = 0;

    // --- DAY DISPLAY LOGIC ---
    const daysOfTheWeek = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    
    function updateDayText() {
      const today = new Date();
      dayDisplay.textContent = daysOfTheWeek[today.getDay()];
    }
    
    updateDayText();
    setInterval(updateDayText, 60000);

    // Right-Click Dragging with 4x4 snapping for the Day Display
    let isDraggingDay = false;
    let dayDragOffsetX = 0;
    let dayDragOffsetY = 0;

    dayDisplay.addEventListener('mousedown', (e) => {
      if (e.button === 2) {
        e.preventDefault();
        e.stopPropagation();
        isDraggingDay = true;
        dayDisplay.classList.add('dragging');

        const rect = dayDisplay.getBoundingClientRect();
        dayDisplay.style.transform = 'none';
        dayDisplay.style.left = rect.left + 'px';
        dayDisplay.style.top = rect.top + 'px';

        dayDragOffsetX = e.clientX - rect.left;
        dayDragOffsetY = e.clientY - rect.top;
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (isDraggingDay) {
        let newX = e.clientX - dayDragOffsetX;
        let newY = e.clientY - dayDragOffsetY;

        newX = Math.round(newX / 4) * 4;
        newY = Math.round(newY / 4) * 4;

        dayDisplay.style.left = newX + 'px';
        dayDisplay.style.top = newY + 'px';
      }
    });

    window.addEventListener('mouseup', (e) => {
      if (e.button === 2 && isDraggingDay) {
        isDraggingDay = false;
        dayDisplay.classList.remove('dragging');
      }
    });

    dayDisplay.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      e.stopPropagation();
    });
    // --- END DAY DISPLAY LOGIC ---

    function saveState() {
      const state = {
        wallpaperSrc: currentWallpaperUrl,
        wallpaperType: currentWallpaperType,
        shelfPosition: currentPosition,
        autohide: isAutohideEnabled,
        loopVideo: isVideoLooping,
        rainActive: isRainActive,
        apps: Array.from(document.querySelectorAll('#mainAppGrid .app-icon')).map(app => ({
          name: app.querySelector('span').textContent,
          icon: app.querySelector('img').src,
          url: app.getAttribute('onclick').match(/'([^']*)'/g)[2].replace(/'/g, '')
        }))
      };
      localStorage.setItem('osState', JSON.stringify(state));
    }

    function loadState() {
      const state = JSON.parse(localStorage.getItem('osState'));
      if (state) {
        if (state.apps && state.apps.length > 0) {
          const grid = document.getElementById('mainAppGrid');
          grid.innerHTML = '';
          state.apps.forEach(app => {
            const el = document.createElement('div');
            el.className = 'app-icon';
            el.setAttribute('onclick', `openApp('${app.name}', '${app.icon}', '${app.url}')`);
            el.innerHTML = `<div class="icon-img"><img src="${app.icon}" alt="${app.name}"></div><span>${app.name}</span>`;
            grid.appendChild(el);
          });
        }
        
        currentPosition = state.shelfPosition || 'bottom';
        setShelfPosition(currentPosition);

        isAutohideEnabled = state.autohide || false;
        document.getElementById('autohideLabel').textContent = isAutohideEnabled ? "Disable Autohide" : "Autohide Shelf";
        if(isAutohideEnabled) shelf.classList.add('autohide');

        isVideoLooping = state.loopVideo !== false;
        document.getElementById('loopVideoModalBtn').textContent = isVideoLooping ? "Loop Video: ON" : "Loop Video: OFF";

        isRainActive = state.rainActive !== false;
        document.getElementById('rainModalBtn').textContent = isRainActive ? "Rain Effect: ON" : "Rain Effect: OFF";
        if(isRainActive) initRain(); else ctxRain.clearRect(0, 0, rainCanvas.width, rainCanvas.height);

        if (state.wallpaperSrc) {
          setWallpaper(state.wallpaperSrc, state.wallpaperType || 'image');
        }
      } else {
        initRain();
      }
      updateInstalledApps();
    }

    // --- GitHub Wallpaper Fetcher ---
    function renderWallpapers() {
      wg.innerHTML = '';
      wallpapers.forEach(wp => {
        const div = document.createElement('div');
        div.className = 'wallpaper-option';
        const isVideo = wp.url.toLowerCase().endsWith('.mp4');

        if(isVideo) {
          const vid = document.createElement('video');
          vid.src = wp.url;
          vid.muted = true; 
          vid.loop = true;
          div.appendChild(vid);
          div.addEventListener('mouseenter', () => vid.play());
          div.addEventListener('mouseleave', () => vid.pause());
        } else {
          div.style.backgroundImage = `url('${wp.url}')`;
        }
        
        div.onclick = () => { 
          setWallpaper(wp.url, isVideo ? 'video' : 'image'); 
          closeWallpaperModal(); 
          saveState(); 
        };
        wg.appendChild(div);
      });
    }

    async function fetchGitHubWallpapers() {
      const repoOwner = 'school-rgb';
      const repoName = 'frutiger-os-wallpaper';
      const apiUrl = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/`;

      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);

        const files = await response.json();
        const imageExtensions = ['.png', '.jpg', '.jpeg', '.webp', '.gif', '.svg', '.mp4'];

        const remoteWallpapers = files
          .filter(file => file.type === 'file' && imageExtensions.some(ext => file.name.toLowerCase().endsWith(ext)))
          .map(file => ({
            name: file.name.replace(/\.[^/.]+$/, "").replace(/[-_]/g, ' '),
            url: file.download_url
          }));

        wallpapers.push(...remoteWallpapers);
        renderWallpapers();

        const state = JSON.parse(localStorage.getItem('osState'));
        if ((!state || !state.wallpaperSrc) && wallpapers.length > 0) {
          setWallpaper(wallpapers[0].url, wallpapers[0].url.toLowerCase().endsWith('.mp4') ? 'video' : 'image');
        }
      } catch (error) {
        console.error('Failed to load GitHub wallpapers:', error);
      }
    }

    function setWallpaper(src, type) {
      currentWallpaperUrl = src;
      currentWallpaperType = type;
      if (type === 'image') {
        wallpaperContainer.innerHTML = '';
        wallpaperContainer.style.backgroundImage = `url(${src})`;
      } else {
        wallpaperContainer.style.backgroundImage = 'none';
        wallpaperContainer.innerHTML = `<video src="${src}" autoplay muted ${isVideoLooping ? 'loop' : ''}></video>`;
      }
      saveState();
    }

    function toggleVideoLooping() {
      isVideoLooping = !isVideoLooping;
      document.getElementById('loopVideoModalBtn').textContent = isVideoLooping ? "Loop Video: ON" : "Loop Video: OFF";
      const vid = wallpaperContainer.querySelector('video');
      if (vid) vid.loop = isVideoLooping;
      saveState();
    }

    // --- Rain Effect Engine ---
    const rainCanvas = document.getElementById('rainCanvas');
    const ctxRain = rainCanvas.getContext('2d');
    let rainDrops = [];
    let rainAnimationId;

    function resizeRain() {
      rainCanvas.width = window.innerWidth;
      rainCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeRain);
    resizeRain();

    function initRain() {
      if(!isRainActive) return;
      rainDrops = [];
      for(let i=0; i<150; i++) {
        rainDrops.push({
          x: Math.random() * rainCanvas.width,
          y: Math.random() * rainCanvas.height,
          l: Math.random() * 20 + 10,
          s: Math.random() * 10 + 5
        });
      }
      drawRain();
    }

    function drawRain() {
      if(!isRainActive) return;
      ctxRain.clearRect(0, 0, rainCanvas.width, rainCanvas.height);
      ctxRain.strokeStyle = 'rgba(255, 255, 255, 0.15)';
      ctxRain.lineWidth = 1;
      ctxRain.beginPath();
      for(let i=0; i<rainDrops.length; i++) {
        let d = rainDrops[i];
        ctxRain.moveTo(d.x, d.y);
        ctxRain.lineTo(d.x, d.y + d.l);
        d.y += d.s;
        if(d.y > rainCanvas.height) {
          d.y = -d.l;
          d.x = Math.random() * rainCanvas.width;
        }
      }
      ctxRain.stroke();
      rainAnimationId = requestAnimationFrame(drawRain);
    }

    function toggleRainEffect() {
      isRainActive = !isRainActive;
      document.getElementById('rainModalBtn').textContent = isRainActive ? "Rain Effect: ON" : "Rain Effect: OFF";
      if(isRainActive) {
        initRain();
      } else {
        cancelAnimationFrame(rainAnimationId);
        ctxRain.clearRect(0, 0, rainCanvas.width, rainCanvas.height);
      }
      saveState();
    }

    // Live Clock Update
    setInterval(() => {
      const now = new Date();
      let h = now.getHours(), m = now.getMinutes();
      const ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      m = m < 10 ? '0'+m : m;
      document.getElementById('clockTime').textContent = `${h}:${m} ${ampm}`;
    }, 1000);

    // Context Menu Logic
    window.addEventListener('contextmenu', e => {
      if (e.target.closest('#launcherMenu') || e.target.closest('.app-window') || e.target.closest('#dayDisplay')) return;
      
      const appIconEl = e.target.closest('.app-icon');
      if (appIconEl) {
        e.preventDefault();
        appContextMenu.style.display = 'flex';
        appContextMenu.style.left = Math.min(e.pageX, window.innerWidth - 220) + 'px';
        appContextMenu.style.top = Math.min(e.pageY, window.innerHeight - 80) + 'px';
        appContextMenu.setAttribute('data-target-app', appIconEl.querySelector('span').textContent);
        contextMenu.classList.remove('active');
        return;
      }

      if (!e.target.closest('.shelf') && e.target === document.body || e.target.closest('.desktop')) {
        e.preventDefault();
        contextMenu.classList.add('active');
        contextMenu.style.left = Math.min(e.pageX, window.innerWidth - 220) + 'px';
        contextMenu.style.top = Math.min(e.pageY, window.innerHeight - 150) + 'px';
        appContextMenu.style.display = 'none';
      }
    });

    window.addEventListener('click', e => {
      if (!e.target.closest('.context-menu')) {
        contextMenu.classList.remove('active');
        appContextMenu.style.display = 'none';
      }
    });

    document.getElementById('deleteAppBtn').onclick = () => {
      const targetAppName = appContextMenu.getAttribute('data-target-app');
      if (targetAppName) {
        const appIcons = document.querySelectorAll('#mainAppGrid .app-icon');
        appIcons.forEach(app => {
          if (app.querySelector('span').textContent === targetAppName) {
            app.remove();
          }
        });
        saveState();
        updateInstalledApps();
        appContextMenu.style.display = 'none';
      }
    };

    function toggleAlwaysHideShelf() {
      isAutohideEnabled = !isAutohideEnabled;
      document.getElementById('autohideLabel').textContent = isAutohideEnabled ? "Disable Autohide" : "Autohide Shelf";
      if(isAutohideEnabled) {
        shelf.classList.add('autohide');
        shelfTriggerZone.classList.add('active');
      } else {
        shelf.classList.remove('autohide');
        shelfTriggerZone.classList.remove('active');
      }
      contextMenu.classList.remove('active');
      saveState();
    }

    function setShelfPosition(pos) {
      shelf.classList.remove('pos-bottom', 'pos-left', 'pos-right');
      shelfTriggerZone.classList.remove('pos-bottom', 'pos-left', 'pos-right');
      launcher.classList.remove('pos-bottom', 'pos-left', 'pos-right', 'dragged-active');
      
      launcher.style.transform = '';
      launcher.style.left = '';
      launcher.style.top = '';
      launcher.style.right = '';
      launcher.style.bottom = '';

      currentPosition = pos;
      shelf.classList.add(`pos-${pos}`);
      shelfTriggerZone.classList.add(`pos-${pos}`);
      launcher.classList.add(`pos-${pos}`);

      contextMenu.classList.remove('active');
      saveState();
    }

    shelfTriggerZone.addEventListener('mouseenter', () => {
      if(isAutohideEnabled || shelf.classList.contains('app-fullscreen-hide')) shelf.classList.add('reveal');
    });
    shelf.addEventListener('mouseleave', () => {
      if(isAutohideEnabled || shelf.classList.contains('app-fullscreen-hide')) shelf.classList.remove('reveal');
    });
    shelf.addEventListener('mouseenter', () => {
      if(isAutohideEnabled || shelf.classList.contains('app-fullscreen-hide')) shelf.classList.add('reveal');
    });

    function checkFullscreenApps() {
      let hasMaximized = false;
      for (const id in openApps) {
        if (!openApps[id].window.classList.contains('hidden') && openApps[id].isMaximized) {
          hasMaximized = true;
          break;
        }
      }
      if (hasMaximized && !isAutohideEnabled) {
        shelf.classList.add('app-fullscreen-hide');
        shelfTriggerZone.classList.add('active');
      } else if (!isAutohideEnabled) {
        shelf.classList.remove('app-fullscreen-hide', 'reveal');
        shelfTriggerZone.classList.remove('active');
      }
    }

    function openWallpaperModal() { wallpaperModal.classList.add('active'); contextMenu.classList.remove('active'); }
    function closeWallpaperModal() { wallpaperModal.classList.remove('active'); }

    function toggleLauncher(e) {
      if(e) e.stopPropagation();
      launcher.classList.toggle('active');
      updateInstalledApps();
    }

    document.addEventListener('click', e => {
      if (!e.target.closest('.launcher') && !e.target.closest('#launcherBtn')) {
        launcher.classList.remove('active');
      }
    });

    let isDraggingLauncher = false;
    let launcherOffsetX, launcherOffsetY;

    launcherDragHandle.addEventListener('mousedown', (e) => {
      isDraggingLauncher = true;
      launcher.classList.add('dragging');
      launcher.classList.add('dragged-active'); 
      const rect = launcher.getBoundingClientRect();
      launcher.style.transform = 'none'; 
      launcher.style.left = rect.left + 'px';
      launcher.style.top = rect.top + 'px';
      launcher.style.bottom = 'auto';
      launcher.style.right = 'auto';

      launcherOffsetX = e.clientX - rect.left;
      launcherOffsetY = e.clientY - rect.top;
    });

    let currentResizingElement = null;
    let resizeDir = '';
    let startW, startH, startX, startY, startLeft, startTop;

    function initResize(e, el, dir) {
      e.preventDefault();
      e.stopPropagation();
      currentResizingElement = el;
      resizeDir = dir;
      el.classList.add('resizing');
      document.body.classList.add('is-interacting');
      const rect = el.getBoundingClientRect();
      startW = rect.width;
      startH = rect.height;
      startX = e.clientX;
      startY = e.clientY;
      startLeft = rect.left;
      startTop = rect.top;
    }

    document.querySelectorAll('.launcher .resize-handle').forEach(handle => {
      handle.addEventListener('mousedown', e => {
        initResize(e, launcher, handle.className.replace('resize-handle ', ''));
      });
    });

    window.addEventListener('mousemove', e => {
      if (isDraggingLauncher) {
        launcher.style.left = (e.clientX - launcherOffsetX) + 'px';
        launcher.style.top = (e.clientY - launcherOffsetY) + 'px';
      }

      if (currentResizingElement) {
        let dw = e.clientX - startX;
        let dh = e.clientY - startY;

        if (resizeDir.includes('e')) {
          currentResizingElement.style.width = Math.max(300, startW + dw) + 'px';
        }
        if (resizeDir.includes('s')) {
          currentResizingElement.style.height = Math.max(300, startH + dh) + 'px';
        }
        if (resizeDir.includes('w')) {
          let newW = Math.max(300, startW - dw);
          if(newW > 300) {
            currentResizingElement.style.width = newW + 'px';
            currentResizingElement.style.left = (startLeft + dw) + 'px';
          }
        }
        if (resizeDir.includes('n')) {
          let newH = Math.max(300, startH - dh);
          if(newH > 300) {
            currentResizingElement.style.height = newH + 'px';
            currentResizingElement.style.top = (startTop + dh) + 'px';
          }
        }
      }
    });

    window.addEventListener('mouseup', () => {
      isDraggingLauncher = false;
      if(launcher) launcher.classList.remove('dragging');
      if (currentResizingElement) {
        currentResizingElement.classList.remove('resizing');
        document.body.classList.remove('is-interacting');
        currentResizingElement = null;
      }
    });

    function updateInstalledApps() {
      installedApps = Array.from(document.querySelectorAll('#mainAppGrid .app-icon')).map(app => {
        return {
          name: app.querySelector('span').textContent,
          icon: app.querySelector('img').src,
          url: app.getAttribute('onclick').match(/'([^']*)'/g)[2].replace(/'/g, '')
        };
      });
    }

    const searchInput = document.getElementById('searchInput');
    const defaultView = document.getElementById('defaultView');
    const searchView = document.getElementById('searchView');

    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) {
        defaultView.classList.remove('hidden');
        searchView.classList.remove('active');
        return;
      }
      
      defaultView.classList.add('hidden');
      searchView.classList.add('active');
      searchView.innerHTML = '';

      const localResults = installedApps.filter(app => app.name.toLowerCase().includes(q));
      
      if (localResults.length > 0) {
        searchView.innerHTML += `<div class="search-category-title">Installed Apps</div>`;
        localResults.forEach(app => {
          searchView.innerHTML += `
            <div class="search-result-item" onclick="openApp('${app.name}', '${app.icon}', '${app.url}'); document.getElementById('launcherMenu').classList.remove('active');">
              <img src="${app.icon}">
              <span>${app.name}</span>
            </div>
          `;
        });
      }

      searchView.innerHTML += `<div class="search-category-title">Web Search</div>`;
      searchView.innerHTML += `
        <div class="search-result-item" onclick="openApp('Google Search', 'https://upload.wikimedia.org/wikipedia/commons/thumb/5/53/Google_%22G%22_Logo.svg/1200px-Google_%22G%22_Logo.svg.png', 'https://www.google.com/search?igu=1&q=${encodeURIComponent(q)}'); document.getElementById('launcherMenu').classList.remove('active');">
          <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/53/Google_%22G%22_Logo.svg/1200px-Google_%22G%22_Logo.svg.png">
          <span>Search web for "${q}"</span>
        </div>
      `;
    });

    // App Window Lifecycle
    function openApp(name, iconSrc, url) {
      if (openApps[name]) {
        showAppWindow(name);
        return;
      }

      launcher.classList.remove('active');

      const win = document.createElement('div');
      win.className = 'app-window windowed';
      win.id = `win-${name.replace(/\s+/g, '-')}`;
      win.style.zIndex = ++highestZIndex;
      win.style.left = (window.innerWidth / 2 - 475) + 'px';
      win.style.top = (window.innerHeight / 2 - 300) + 'px';

      const handles = ['n', 's', 'w', 'e', 'nw', 'ne', 'sw', 'se'];
      handles.forEach(h => {
        const hDiv = document.createElement('div');
        hDiv.className = `resize-handle ${h}`;
        hDiv.addEventListener('mousedown', e => initResize(e, win, h));
        win.appendChild(hDiv);
      });

      const header = document.createElement('div');
      header.className = 'window-header';
      
      const titleDiv = document.createElement('div');
      titleDiv.className = 'window-title';
      titleDiv.innerHTML = `<img src="${iconSrc}"> ${name}`;

      const controlsDiv = document.createElement('div');
      controlsDiv.className = 'window-controls';
      
      const minBtn = document.createElement('button'); minBtn.className = 'win-btn'; minBtn.innerHTML = '−';
      const maxBtn = document.createElement('button'); maxBtn.className = 'win-btn'; maxBtn.innerHTML = '□';
      const closeBtn = document.createElement('button'); closeBtn.className = 'win-btn close'; closeBtn.innerHTML = '✕';

      minBtn.onclick = (e) => { e.stopPropagation(); hideAppWindow(name); };
      maxBtn.onclick = (e) => { e.stopPropagation(); toggleMaximize(name); };
      closeBtn.onclick = (e) => { e.stopPropagation(); closeApp(name); };

      controlsDiv.append(minBtn, maxBtn, closeBtn);
      header.append(titleDiv, controlsDiv);

      const body = document.createElement('div');
      body.className = 'window-body';
      body.innerHTML = `<iframe src="${url}"></iframe>`;

      win.append(header, body);
      desktop.appendChild(win);

      let isDragging = false, startX, startY, startLeft, startTop;
      header.addEventListener('mousedown', (e) => {
        if(e.target.closest('.win-btn') || openApps[name].isMaximized) return;
        isDragging = true;
        win.classList.add('dragging');
        document.body.classList.add('is-interacting');
        highestZIndex++;
        win.style.zIndex = highestZIndex;
        startX = e.clientX; startY = e.clientY;
        startLeft = parseInt(win.style.left || 0);
        startTop = parseInt(win.style.top || 0);
      });

      window.addEventListener('mousemove', (e) => {
        if (isDragging) {
          win.style.left = (startLeft + (e.clientX - startX)) + 'px';
          win.style.top = (startTop + (e.clientY - startY)) + 'px';
        }
      });

      window.addEventListener('mouseup', () => {
        isDragging = false;
        win.classList.remove('dragging');
        document.body.classList.remove('is-interacting');
      });

      win.addEventListener('mousedown', () => {
        highestZIndex++;
        win.style.zIndex = highestZIndex;
      });

      const shelfIcon = document.createElement('div');
      shelfIcon.className = 'shelf-app-icon active';
      shelfIcon.id = `dock-${name.replace(/\s+/g, '-')}`;
      shelfIcon.innerHTML = `<img src="${iconSrc}">`;
      shelfIcon.onclick = () => {
        if (openApps[name].window.classList.contains('hidden')) {
          showAppWindow(name);
        } else if (win.style.zIndex == highestZIndex) {
          hideAppWindow(name);
        } else {
          highestZIndex++;
          win.style.zIndex = highestZIndex;
        }
      };
      shelfCenter.appendChild(shelfIcon);

      openApps[name] = { window: win, dock: shelfIcon, isMaximized: false };
      checkFullscreenApps();
      updateAltTabKeys();
    }

    function toggleMaximize(name) {
      const app = openApps[name];
      if (app.isMaximized) {
        app.window.classList.add('windowed');
        app.window.style.width = '950px';
        app.window.style.height = '600px';
        app.window.style.left = (window.innerWidth / 2 - 475) + 'px';
        app.window.style.top = (window.innerHeight / 2 - 300) + 'px';
        app.isMaximized = false;
      } else {
        app.window.classList.remove('windowed');
        app.window.style.width = '100vw';
        app.window.style.height = '100vh';
        app.window.style.left = '0px';
        app.window.style.top = '0px';
        app.isMaximized = true;
      }
      highestZIndex++;
      app.window.style.zIndex = highestZIndex;
      checkFullscreenApps();
    }

    function hideAppWindow(name) {
      openApps[name].window.classList.add('hidden');
      openApps[name].dock.classList.remove('active');
      checkFullscreenApps();
    }

    function showAppWindow(name) {
      const app = openApps[name];
      app.window.classList.remove('hidden');
      app.dock.classList.add('active');
      highestZIndex++;
      app.window.style.zIndex = highestZIndex;
      checkFullscreenApps();
    }

    function closeApp(name) {
      openApps[name].window.remove();
      openApps[name].dock.remove();
      delete openApps[name];
      checkFullscreenApps();
      updateAltTabKeys();
    }

    // --- Alt-Tab Logic ---
    function updateAltTabKeys() {
      altTabAppKeys = Object.keys(openApps);
    }

    let isAltTabMode = false;
    
    document.addEventListener('keydown', (e) => {
      if (e.altKey && e.key === 'Tab') {
        e.preventDefault();
        if (altTabAppKeys.length === 0) return;
        
        if (!isAltTabMode) {
          isAltTabMode = true;
          altTabOverlay.classList.add('active');
          renderAltTabGrid();
        }
        
        altTabIndex = (altTabIndex + (e.shiftKey ? -1 : 1) + altTabAppKeys.length) % altTabAppKeys.length;
        updateAltTabSelection();
      }
    });

    document.addEventListener('keyup', (e) => {
      if (e.key === 'Alt' && isAltTabMode) {
        isAltTabMode = false;
        altTabOverlay.classList.remove('active');
        if(altTabAppKeys.length > 0) {
          const targetApp = altTabAppKeys[altTabIndex];
          showAppWindow(targetApp);
        }
      }
    });

    function renderAltTabGrid() {
      altTabOverlay.innerHTML = '';
      altTabAppKeys.forEach((key, index) => {
        const appInfo = installedApps.find(a => a.name === key) || { icon: openApps[key].dock.querySelector('img').src };
        const card = document.createElement('div');
        card.className = 'alttab-card' + (index === altTabIndex ? ' selected' : '');
        card.innerHTML = `<img src="${appInfo.icon}"><span>${key}</span>`;
        altTabOverlay.appendChild(card);
      });
    }

    function updateAltTabSelection() {
      const cards = altTabOverlay.querySelectorAll('.alttab-card');
      cards.forEach((c, i) => {
        if(i === altTabIndex) c.classList.add('selected');
        else c.classList.remove('selected');
      });
    }

    // Init Sequence
    loadState();
    fetchGitHubWallpapers();
  </script>
</body>
</html>
